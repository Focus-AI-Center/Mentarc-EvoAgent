name: Bug report
description: Something in EvoAgent behaves differently from expectation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report. A few notes first:
        - Read [SECURITY.md](../blob/main/SECURITY.md) **before** reporting issues with `execute_code`, demo auth, or CORS — those components are intentionally demo-grade.
        - For security vulnerabilities, use a private channel (see SECURITY.md), not a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. A failing command, a failing request, or a transcript.
      placeholder: |
        1. Set `MODEL=gpt-4o`
        2. `python -m app.api.server`
        3. POST /api/agent/chat with {...}
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behaviour
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, commit SHA, relevant env-var overrides.
      placeholder: |
        - OS: Ubuntu 22.04
        - Python: 3.11.7
        - Commit: abc1234
        - Env: MODEL=gpt-4o, COMPRESSION_LEVEL=moderate
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Paste the relevant portion. Redact keys before submitting.
      render: shell

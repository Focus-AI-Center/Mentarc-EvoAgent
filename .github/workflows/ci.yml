name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Public source check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/release_check.py --history
      - run: python3 -m unittest tests.unit.test_release_check

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.11.13"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  import-check:
    name: Import smoke and unit tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      PYTHON_DOTENV_DISABLED: "1"
      OPENAI_API_KEY: "offline-test"
      OPENAI_AGENTS_DISABLE_TRACING: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MINIO_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest>=8.0,<9.0" "pytest-asyncio>=0.23,<1.0"

      - name: Byte-compile all modules
        run: python -m compileall -q app core configs utils

      - name: Import core packages
        run: |
          python -c "import app.api.server; import core.agent; import core.sub_agent; import core.plugins"

      - name: Offline unit tests
        run: python -m pytest -p asyncio tests/unit/ -q --disable-warnings --tb=short

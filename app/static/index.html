<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvoAgent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
<style>
  :root {
    /* Warm editorial palette */
    --bg: #f5f4ed;              /* Parchment — page background */
    --bg-secondary: #faf9f5;    /* Ivory — cards, elevated surfaces */
    --bg-tertiary: #e8e6dc;     /* Warm Sand — buttons, chips */
    --fg: #141413;              /* Near black */
    --fg-secondary: #4d4c48;    /* Charcoal Warm */
    --fg-muted: #87867f;        /* Stone Gray */
    --accent: #c96442;          /* Terracotta Brand — primary CTA */
    --accent-hover: #d97757;    /* Coral Accent */
    --border: #e8e6dc;          /* Border Warm */
    --border-light: #f0eee6;    /* Border Cream */
    --ring: #d1cfc5;            /* Ring Warm — ring-shadow color */
    --user-bg: #141413;         /* Near Black bubble */
    --user-text: #faf9f5;       /* Ivory text on dark */
    --bot-bg: #faf9f5;          /* Ivory bubble */
    --bot-text: #141413;
    --tool-bg: #faf9f5;         /* Ivory (replaces warm-yellow) */
    --tool-border: #e8e6dc;     /* Border Warm */
    --shadow-sm: 0 1px 2px rgba(20,20,19,0.04);
    --shadow-md: 0 4px 24px rgba(20,20,19,0.05);  /* Whisper shadow */
    --shadow-lg: 0 8px 32px rgba(20,20,19,0.08);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-pill: 980px;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Source Han Serif SC", serif;
    --font-mono: "SF Mono", "JetBrains Mono", "Fira Code", Monaco, "Cascadia Mono", Menlo, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .hidden { display: none !important; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "kern" 1, "liga" 1;
  }

  /* ========== Navigation ========== */
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    height: 52px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
    z-index: 10;
  }
  .header .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: auto;
  }
  .header .logo-icon {
    width: 28px;
    height: 28px;
    background: var(--fg);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0;
  }
  .header .logo-text {
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--fg);
    letter-spacing: -0.01em;
  }
  .header .nav-dots {
    display: flex;
    gap: 6px;
    margin-right: 12px;
  }
  .header .nav-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .header .nav-dot:nth-child(1) { background: #ff5f56; }
  .header .nav-dot:nth-child(2) { background: #ffbd2e; }
  .header .nav-dot:nth-child(3) { background: #27c93f; }
  .header label {
    font-size: 0.8rem;
    color: var(--fg-muted);
    font-weight: 500;
  }
  .header input {
    padding: 5px 10px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    width: 120px;
    background: var(--bg-tertiary);
    color: var(--fg-secondary);
    outline: none;
    transition: border-color 0.2s;
    font-family: var(--font-mono);
  }
  .header input:focus {
    border-color: var(--accent);
    background: var(--bg);
  }
  .ws-toggle {
    padding: 6px 16px;
    background: transparent;
    color: var(--fg-secondary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .ws-toggle:hover {
    border-color: var(--fg-muted);
    color: var(--fg);
  }
  .ws-toggle.active {
    background: var(--fg);
    color: white;
    border-color: var(--fg);
  }

  /* ========== Main Layout ========== */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ========== Chat Column ========== */
  .chat-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg);
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }

  /* ========== Messages ========== */
  .msg { max-width: 85%; display: flex; flex-direction: column; animation: msgIn 0.3s ease; }
  .msg.restored { animation: none; }
  .msg.user { align-self: flex-end; }
  .msg.bot { align-self: flex-start; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg .bubble {
    padding: 12px 18px;
    border-radius: var(--radius-lg);
    font-size: 0.9rem;
    line-height: 1.7;
    word-break: break-word;
    letter-spacing: 0.01em;
  }
  .msg.user .bubble {
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bot-bg);
    color: var(--bot-text);
    border-bottom-left-radius: 4px;
    border: 0.5px solid var(--border-light);
  }

  /* ========== Markdown ========== */
  .msg.bot .bubble p { margin: 0.5em 0; }
  .msg.bot .bubble p:first-child { margin-top: 0; }
  .msg.bot .bubble p:last-child { margin-bottom: 0; }
  .msg.bot .bubble code {
    background: rgba(0,0,0,0.05);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.82rem;
    font-family: var(--font-mono);
  }
  .msg.bot .bubble pre {
    background: #1d1d1f;
    color: #d4d4d4;
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    margin: 10px 0;
    font-size: 0.82rem;
    line-height: 1.7;
  }
  .msg.bot .bubble pre code {
    background: none;
    padding: 0;
    color: inherit;
  }
  .msg.bot .bubble ul, .msg.bot .bubble ol {
    margin: 0.5em 0;
    padding-left: 1.5em;
  }
  .msg.bot .bubble table {
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 0.82rem;
    width: 100%;
  }
  .msg.bot .bubble th, .msg.bot .bubble td {
    border: 0.5px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .msg.bot .bubble th {
    background: var(--bg-tertiary);
    font-weight: 600;
  }
  .msg.bot .bubble img {
    max-width: 100%;
    height: auto;
    border-radius: var(--radius-sm);
    margin: 8px 0;
    display: block;
  }

  /* ========== Tool Cards ========== */
  .tool-tags {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin: 6px 0;
  }
  .tool-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    font-size: 0.75rem;
    background: var(--tool-bg);
    border-radius: var(--radius-md);
    box-shadow: 0 0 0 1px var(--border-light);
    transition: box-shadow 0.18s ease, background 0.18s ease;
    flex-wrap: wrap;
  }
  .tool-card:hover {
    background: var(--tool-bg);
    box-shadow: 0 0 0 1px var(--ring);
  }
  .tool-card .tool-icon {
    width: 26px;
    height: 26px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--bg-tertiary);
    color: var(--fg-secondary);
  }
  .tool-card .tool-icon svg {
    width: 15px;
    height: 15px;
  }
  .tool-card .tool-label {
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
    font-size: 0.78rem;
    letter-spacing: 0.01em;
  }
  .tool-card .tool-desc {
    color: var(--fg-muted);
    font-size: 0.72rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
    font-feature-settings: "ss01" on;
  }
  .tool-card.pending .tool-desc { opacity: 0.6; }
  .tool-card.pending .tool-icon {
    background: var(--bg-tertiary);
    color: var(--accent);
    animation: tool-pending-pulse 1.4s ease-in-out infinite;
  }
  @keyframes tool-pending-pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .tool-card.done { cursor: pointer; }
  .tool-card.done:hover {
    box-shadow: 0 0 0 1px var(--ring), var(--shadow-md);
  }
  .tool-card .tool-output {
    width: 100%;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, padding 0.25s ease, margin-top 0.25s ease;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--fg-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
  }
  .tool-card.expanded {
    box-shadow: 0 0 0 1px var(--ring);
  }
  .tool-card.expanded .tool-output {
    max-height: 220px;
    overflow-y: auto;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border-light);
  }

  /* ===== Profile Update Card ===== */
  .profile-update-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 4px 0;
  }
  .profile-field {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 0.75rem;
    line-height: 1.5;
  }
  .profile-field-name {
    color: var(--fg-muted);
    font-weight: 500;
    white-space: nowrap;
    min-width: 64px;
  }
  .profile-field-name::after { content: '：'; }
  .profile-field-value {
    color: var(--fg);
    word-break: break-all;
  }

  /* ========== Input Area ========== */
  .input-area {
    padding: 8px 32px 24px;
    flex-shrink: 0;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .input-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 0 4px 6px;
  }
  .input-action-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 0.72rem;
    color: var(--fg-muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .input-action-btn:hover {
    border-color: var(--fg-muted);
    color: var(--fg-secondary);
  }
  .input-action-btn img {
    opacity: 0.6;
    transition: opacity 0.15s;
  }
  .input-action-btn:hover img {
    opacity: 0.85;
  }
  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg-secondary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 8px 8px 8px 18px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201,100,66,0.1);
  }
  .input-wrap textarea {
    flex: 1;
    padding: 6px 0;
    border: none;
    font-size: 0.9rem;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 24px;
    max-height: 120px;
    background: transparent;
    color: var(--fg);
    line-height: 1.5;
  }
  .input-wrap textarea::placeholder {
    color: var(--fg-muted);
  }
  .input-wrap button {
    padding: 8px 18px;
    background: var(--fg);
    color: white;
    border: none;
    border-radius: var(--radius-pill);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    font-family: inherit;
    flex-shrink: 0;
  }
  .input-wrap button:hover:not(:disabled) {
    background: #333336;
    transform: scale(1.02);
  }
  .input-wrap button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ========== Thinking ========== */
  .thinking { color: var(--fg-muted); font-size: 0.85rem; }
  .thinking::after {
    content: '';
    animation: dots 1.5s steps(3) infinite;
  }
  @keyframes dots {
    0%   { content: '.'; }
    33%  { content: '..'; }
    66%  { content: '...'; }
  }

  /* ========== Workspace Panel ========== */
  .workspace {
    width: 420px;
    border-left: 0.5px solid rgba(0,0,0,0.08);
    background: var(--bg-secondary);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }


  .ws-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
  }
  .ws-header .ws-title {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--fg);
  }
  .ws-header .ws-btn {
    padding: 4px 12px;
    background: var(--bg-tertiary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--fg-secondary);
    transition: all 0.2s;
    font-family: inherit;
  }
  .ws-header .ws-btn:hover {
    border-color: var(--fg-muted);
    color: var(--fg);
  }

  /* Directory pills */
  .ws-dir-tabs {
    display: flex;
    gap: 6px;
    padding: 12px 18px;
    overflow-x: auto;
    flex-shrink: 0;
    border-bottom: 0.5px solid rgba(0,0,0,0.06);
    background: var(--bg);
  }
  .ws-dir-tab {
    padding: 6px 14px;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--bg);
    color: var(--fg-secondary);
    white-space: nowrap;
    transition: all 0.2s;
    font-family: inherit;
  }
  .ws-dir-tab:hover {
    border-color: var(--fg-muted);
  }
  .ws-dir-tab.active {
    background: var(--fg);
    border-color: var(--fg);
    color: white;
  }
  .ws-dir-tab .ws-badge {
    display: inline-block;
    margin-left: 4px;
    padding: 0 5px;
    font-size: 0.65rem;
    background: rgba(0,0,0,0.06);
    border-radius: var(--radius-pill);
    color: var(--fg-muted);
  }
  .ws-dir-tab.active .ws-badge {
    background: rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.9);
  }

  /* File list */
  .ws-dir-content {
    flex: 1;
    overflow-y: auto;
    display: none;
    flex-direction: column;
  }
  .ws-dir-content.active { display: flex; }

  .ws-file-item {
    border-bottom: 0.5px solid rgba(0,0,0,0.06);
  }
  .ws-file-item summary {
    padding: 10px 18px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
    transition: background 0.15s;
  }
  .ws-file-item summary:hover {
    background: rgba(0,0,0,0.02);
  }
  .ws-file-item summary::-webkit-details-marker { display: none; }
  .ws-file-item summary::before {
    content: '\25B8';
    font-size: 11px;
    color: var(--fg-muted);
    transition: transform 0.15s;
  }
  .ws-file-item[open] summary::before {
    transform: rotate(90deg);
  }
  .ws-file-item .ws-file-size {
    font-size: 0.7rem;
    color: var(--fg-muted);
    margin-left: auto;
    font-family: var(--font-mono);
  }
  .ws-file-item textarea {
    width: 100%;
    padding: 14px 18px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    line-height: 1.6;
    border: none;
    border-top: 0.5px solid rgba(0,0,0,0.06);
    outline: none;
    background: var(--bg);
    resize: vertical;
    min-height: 100px;
    max-height: 400px;
    color: var(--fg-secondary);
  }
  .ws-file-item textarea[readonly] {
    background: var(--bg-tertiary);
    color: var(--fg-muted);
    cursor: default;
  }
  .ws-file-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 8px 18px;
    background: var(--bg);
    border-top: 0.5px solid rgba(0,0,0,0.04);
  }
  .ws-save-btn {
    padding: 5px 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-pill);
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .ws-save-btn:hover {
    background: var(--accent-hover);
  }
  .ws-save-status {
    font-size: 0.75rem;
    color: #7a8a6f;
    align-self: center;
    font-weight: 500;
  }
  .ws-empty {
    padding: 32px 18px;
    color: var(--fg-muted);
    font-size: 0.85rem;
    text-align: center;
  }

  /* ========== HTML Preview Card (in chat bubble) ========== */
  .html-preview-card {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; margin: 10px 0;
    background: var(--bg-secondary);
    box-shadow: 0 0 0 1px var(--border-light);
    border-radius: var(--radius-md); cursor: pointer;
    transition: box-shadow 0.2s ease;
    max-width: 380px;
  }
  .html-preview-card:hover {
    box-shadow: 0 0 0 1px var(--ring), var(--shadow-md);
  }
  .html-preview-card .hpc-icon {
    width: 40px; height: 40px; border-radius: var(--radius-sm);
    background: var(--bg-tertiary);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .html-preview-card .hpc-info { flex: 1; min-width: 0; }
  .html-preview-card .hpc-title {
    font-size: 0.85rem; font-weight: 600; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .html-preview-card .hpc-hint {
    font-size: 0.75rem; color: var(--fg-muted); margin-top: 2px;
  }
  .html-preview-card .hpc-arrow {
    font-size: 1rem; color: var(--fg-muted); flex-shrink: 0;
  }

  /* ========== HTML Preview Panel ========== */
  .preview-panel {
    width: 50%;
    min-width: 420px;
    max-width: 800px;
    border-left: 0.5px solid rgba(0,0,0,0.08);
    background: var(--bg-secondary);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .pp-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
  }
  .pp-header .pp-title { font-weight: 600; font-size: 0.9rem; color: var(--fg); }
  .pp-header .pp-actions { display: flex; gap: 6px; }
  .pp-header .pp-btn {
    background: none; border: 1px solid var(--border); cursor: pointer;
    font-size: 0.78rem; color: var(--fg-secondary); padding: 3px 10px;
    border-radius: 6px; transition: all 0.15s;
  }
  .pp-header .pp-btn:hover { background: var(--bg-tertiary); }
  .pp-body {
    flex: 1; overflow: hidden; position: relative;
  }
  .pp-body iframe {
    width: 100%; height: 100%; border: none; background: #fff;
  }

  /* ========== Growth Panel ========== */
  .growth-panel {
    width: 420px;
    border-left: 0.5px solid rgba(0,0,0,0.08);
    background: var(--bg-secondary);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .gp-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
  }
  .gp-header .gp-title { font-weight: 600; font-size: 0.9rem; color: var(--fg); }
  .gp-header .gp-close {
    background: none; border: none; cursor: pointer; font-size: 1.1rem;
    color: var(--fg-muted); padding: 2px 6px; border-radius: 4px;
  }
  .gp-header .gp-close:hover { background: var(--bg-tertiary); }
  .gp-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  /* Overview card (top dark card) */
  .gp-overview {
    background: var(--fg);
    border-radius: var(--radius-lg); padding: 22px; color: var(--user-text);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
  }
  .gp-overview-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .gp-overview-icon { width: 28px; height: 28px; filter: brightness(0) invert(1); opacity: 0.9; }
  .gp-overview-title { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; letter-spacing: -0.01em; }
  .gp-overview-dots { font-size: 0.82rem; margin-bottom: 8px; letter-spacing: 2px; }
  .gp-overview-stats { font-size: 0.78rem; display: flex; gap: 8px; flex-wrap: wrap; }
  .gp-overview-stats .gp-stat-chip {
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    background: rgba(255,255,255,0.08);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.88);
  }
  .gp-overview-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: rgba(255,255,255,0.55); margin-top: 6px; }

  /* Skill evolution card */
  .gp-skill-card {
    background: var(--bg-primary); border-radius: 12px;
    border: 0.5px solid var(--border); padding: 14px 16px;
    transition: box-shadow 0.2s;
  }
  .gp-skill-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .gp-skill-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .gp-skill-name { font-weight: 600; font-size: 0.85rem; color: var(--fg); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gp-skill-ver { font-size: 0.68rem; color: var(--fg-muted); }
  .gp-source-tag {
    font-size: 0.65rem; padding: 1px 8px; border-radius: 10px; font-weight: 500; white-space: nowrap;
  }
  .gp-source-builtin { background: rgba(201,100,66,0.1); color: #c96442; }
  .gp-source-extracted { background: rgba(122,138,111,0.1); color: #7a8a6f; }
  .gp-source-user { background: var(--bg-tertiary); color: var(--fg-secondary); }
  .gp-skill-desc { font-size: 0.75rem; color: var(--fg-muted); margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Maturity stages */
  .gp-maturity-icons { font-size: 0.82rem; margin-bottom: 6px; letter-spacing: 1px; }
  .gp-maturity-icons .active { opacity: 1; }
  .gp-maturity-icons .inactive { opacity: 0.25; }
  .gp-maturity-bar { height: 6px; border-radius: 3px; background: var(--bg-tertiary); overflow: hidden; margin-bottom: 6px; }
  .gp-maturity-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .gp-maturity-label { font-size: 0.7rem; font-weight: 500; margin-bottom: 8px; }

  /* Skill metrics */
  .gp-skill-metrics { display: flex; gap: 12px; font-size: 0.72rem; color: var(--fg-muted); margin-bottom: 6px; }
  .gp-tool-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .gp-tool-tag {
    font-size: 0.65rem; padding: 1px 7px; border-radius: 8px;
    background: var(--bg-tertiary); color: var(--fg-muted);
  }

  /* Timeline */
  .gp-timeline-title { font-weight: 600; font-size: 0.82rem; color: var(--fg); margin-bottom: 10px; }
  .gp-timeline { position: relative; padding-left: 18px; }
  .gp-timeline::before {
    content: ''; position: absolute; left: 5px; top: 0; bottom: 0;
    width: 2px; background: var(--border); border-radius: 1px;
  }
  .gp-timeline-date {
    font-size: 0.7rem; font-weight: 600; color: var(--fg-muted);
    margin-bottom: 6px; position: relative;
  }
  .gp-timeline-date::before {
    content: ''; position: absolute; left: -17px; top: 4px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg-primary);
  }
  .gp-timeline-event {
    font-size: 0.72rem; color: var(--fg-muted); margin-bottom: 4px;
    padding-left: 4px;
  }
  .gp-timeline-group { margin-bottom: 12px; }

  /* Empty state */
  .gp-empty { text-align: center; color: var(--fg-muted); padding: 40px 0; font-size: 0.85rem; }

  /* ========== Session Cards ========== */
  .session-card {
    padding: 12px 18px;
    border-bottom: 0.5px solid rgba(0,0,0,0.06);
    cursor: pointer;
    transition: background 0.15s;
  }
  .session-card:hover {
    background: rgba(0,0,0,0.02);
  }
  .session-card.active {
    background: rgba(201,100,66,0.06);
    border-left: 2px solid var(--accent);
  }
  .session-card.session-card-opp {
    margin: 8px 12px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(201,100,66,0.06), rgba(201,100,66,0.02));
    border: 0.5px solid rgba(201,100,66,0.15);
    border-left: 3px solid var(--accent);
  }
  .session-card.session-card-opp:hover {
    background: linear-gradient(135deg, rgba(201,100,66,0.1), rgba(201,100,66,0.04));
  }
  .session-card.session-card-opp.active {
    background: linear-gradient(135deg, rgba(201,100,66,0.12), rgba(201,100,66,0.06));
    border-color: var(--accent);
  }
  .session-tag {
    display: inline-block;
    padding: 1px 6px;
    margin-right: 6px;
    font-size: 0.65rem;
    font-weight: 600;
    background: rgba(201,100,66,0.1);
    color: var(--accent);
    border-radius: var(--radius-pill);
    vertical-align: middle;
  }
  .session-card .session-preview {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .session-card .session-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.72rem;
    color: var(--fg-muted);
  }
  .session-card .session-meta .session-id {
    font-family: var(--font-mono);
  }

  /* ========== Sidebar ========== */
  .sidebar {
    width: 260px;
    background: var(--bg-secondary);
    border-right: 0.5px solid rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
  }
  .sidebar-header span {
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--fg);
  }
  .sidebar-new-btn {
    padding: 5px 14px;
    background: var(--fg);
    color: white;
    border: none;
    border-radius: var(--radius-pill);
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .sidebar-new-btn:hover {
    background: #333336;
    transform: scale(1.02);
  }
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
  }
  .sidebar-empty {
    padding: 32px 16px;
    color: var(--fg-muted);
    font-size: 0.82rem;
    text-align: center;
  }

  /* ========== Sidebar Sections (Profile & Memory) ========== */
  .sidebar-section {
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
  }
  .sidebar-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--fg);
    transition: background 0.15s;
    user-select: none;
  }
  .sidebar-section-header:hover { background: rgba(0,0,0,0.03); }
  .sidebar-chevron {
    font-size: 10px;
    color: var(--fg-muted);
    transition: transform 0.2s;
  }
  .sidebar-section.open .sidebar-chevron { transform: rotate(90deg); }
  .sidebar-section-body {
    padding: 0 16px 12px;
    max-height: 240px;
    overflow-y: auto;
  }

  /* Profile table */
  .profile-table { width: 100%; border-collapse: collapse; }
  .profile-table td {
    padding: 3px 0;
    font-size: 0.73rem;
    vertical-align: top;
    border-bottom: 0.5px solid rgba(0,0,0,0.04);
  }
  .profile-table .field-name {
    color: var(--fg-muted);
    white-space: nowrap;
    width: 72px;
    padding-right: 6px;
    font-weight: 500;
  }
  .profile-table .field-value { color: var(--fg); word-break: break-all; }
  .profile-table .field-empty { color: var(--fg-muted); font-style: italic; opacity: 0.6; }

  /* Memory rendered */
  .memory-rendered {
    font-size: 0.73rem;
    line-height: 1.5;
    color: var(--fg-secondary);
  }
  .memory-rendered h2 { font-size: 0.76rem; margin: 8px 0 4px; color: var(--fg); }
  .memory-rendered p { margin: 4px 0; }
  .memory-rendered ul { padding-left: 16px; margin: 4px 0; }
  .memory-rendered li { margin: 2px 0; }

  /* Memory index cards (MEMORY.md 索引) */
  .memory-index { display: flex; flex-direction: column; gap: 8px; }
  .memory-card {
    padding: 8px 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    box-shadow: 0 0 0 1px var(--border-light);
  }
  .memory-card-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
    flex-wrap: wrap;
  }
  .memory-type {
    font-size: 0.62rem;
    padding: 1px 7px;
    border-radius: var(--radius-pill);
    font-weight: 500;
    text-transform: lowercase;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .memory-type-user      { background: #e8e6dc; color: #4d4c48; }
  .memory-type-feedback  { background: rgba(201,100,66,0.12); color: #c96442; }
  .memory-type-project   { background: rgba(122,138,111,0.15); color: #5a6a50; }
  .memory-type-reference { background: #f0eee6; color: #87867f; }
  .memory-card-title {
    font-family: var(--font-display);
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--fg);
    line-height: 1.3;
    flex: 1;
    min-width: 0;
  }
  .memory-card-date {
    font-size: 0.62rem;
    color: var(--fg-muted);
    flex-shrink: 0;
  }
  .memory-card-summary {
    font-size: 0.7rem;
    color: var(--fg-secondary);
    line-height: 1.5;
    padding-left: 2px;
  }
  .sidebar-section-empty {
    color: var(--fg-muted);
    font-size: 0.73rem;
    font-style: italic;
    padding: 4px 0;
  }

  /* Task cards in sidebar */
  .task-card { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border-light); }
  .task-card-info { flex:1; min-width:0; }
  .task-card-name { font-weight:600; font-size:0.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .task-card-time { color:var(--fg-muted); font-size:0.72rem; margin-top:2px; }
  .task-card-skill { color:#6366f1; font-size:0.7rem; margin-top:2px; }
  .task-toggle { width:36px; height:20px; border-radius:10px; border:none; background:#ccc; cursor:pointer; position:relative; transition:background .2s; flex-shrink:0; }
  .task-toggle.on { background:#7a8a6f; }
  .task-toggle::after { content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:white; top:2px; left:2px; transition:left .2s; }
  .task-toggle.on::after { left:18px; }
  .task-del-btn { background:none; border:none; color:var(--fg-muted); cursor:pointer; font-size:0.9rem; padding:2px 4px; flex-shrink:0; }
  .task-del-btn:hover { color:#ef4444; }
  .task-add-btn { display:block; width:100%; padding:8px; border:1px dashed var(--border-light); background:none; color:var(--fg-muted); border-radius:6px; cursor:pointer; font-size:0.78rem; margin-top:6px; }
  .task-add-btn:hover { background:rgba(0,0,0,0.02); color:var(--fg-primary); }
  .task-form { padding:10px 12px; border-bottom:1px solid var(--border-light); }
  .task-form label { display:block; font-size:0.72rem; color:var(--fg-muted); margin:6px 0 2px; }
  .task-form input, .task-form textarea, .task-form select { width:100%; padding:6px 8px; border:1px solid var(--border-light); border-radius:6px; font-size:0.8rem; box-sizing:border-box; }
  .task-form textarea { height:60px; resize:vertical; }
  .task-form-row { display:flex; gap:8px; }
  .task-form-row > div { flex:1; }
  .task-form-actions { display:flex; gap:8px; margin-top:8px; justify-content:flex-end; }
  .task-form-cancel, .task-form-save { padding:5px 14px; border-radius:var(--radius-sm); border:none; cursor:pointer; font-size:0.78rem; font-family:inherit; }
  .task-form-cancel { background:var(--bg-tertiary); color:var(--fg-secondary); }
  .task-form-save { background:var(--accent); color:var(--user-text); }
  .task-toast { position:fixed; top:20px; right:20px; background:var(--fg); color:var(--user-text); padding:10px 18px; border-radius:var(--radius-sm); font-size:0.82rem; z-index:9999; animation:fadeIn .3s; }
  .session-tag { display:inline-block; padding:1px 5px; border-radius:3px; font-size:0.65rem; margin-right:4px; background:var(--bg-tertiary); color:var(--fg-secondary); }

  /* Skill cards in sidebar */
  .skill-card { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
  .skill-card-name { font-weight: 600; font-size: 0.85rem; }
  .skill-card-desc { color: var(--fg-muted); font-size: 0.78rem; margin-top: 2px; }
  .skill-card-meta { display: flex; gap: 8px; margin-top: 6px; font-size: 0.72rem; color: var(--fg-muted); align-items: center; }
  .skill-badge { padding: 1px 6px; border-radius: 4px; font-size: 0.7rem; }
  .skill-badge.builtin { background: var(--bg-tertiary); color: var(--fg-secondary); }
  .skill-badge.extracted { background: #dcfce7; color: #16a34a; }
  .skill-badge.user_defined { background: #fef3c7; color: #d97706; }
  .skill-trigger { background: var(--bg-tertiary); padding: 1px 5px; border-radius: 3px; font-size: 0.7rem; margin-right: 4px; display: inline-block; margin-top: 4px; }

  /* Skill proposal card */
  .skill-proposal-card {
    margin-top: 8px; padding: 12px 16px; border-radius: 8px;
    background: #f0fdf4; border: 1px solid #bbf7d0;
  }
  .skill-confirm-btn {
    background: #16a34a; color: white; border: none; padding: 6px 16px;
    border-radius: 6px; cursor: pointer; font-size: 0.82rem;
  }
  .skill-confirm-btn:hover { background: #15803d; }
  .skill-confirm-btn:disabled { opacity: 0.6; cursor: default; }
  .skill-skip-btn {
    background: var(--bg-tertiary); border: 1px solid var(--border); padding: 6px 16px;
    border-radius: 6px; cursor: pointer; font-size: 0.82rem; color: var(--fg-secondary);
  }
  .skill-skip-btn:hover { background: var(--bg-secondary); }

  /* Skill toast */
  .skill-toast {
    position: fixed; top: 20px; right: 20px; z-index: 10000;
    background: #16a34a; color: white; padding: 12px 20px;
    border-radius: 8px; font-size: 0.85rem; box-shadow: var(--shadow-md);
    animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s forwards;
  }
  @keyframes toastIn { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes toastOut { from { opacity:1; } to { opacity:0; } }

  /* Task cards */
  /* Toast */
  .task-toast {
    position: fixed; top: 20px; right: 20px; z-index: 10000;
    background: #c96442; color: white; padding: 12px 20px;
    border-radius: 8px; font-size: 0.85rem; box-shadow: var(--shadow-md);
    animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s forwards;
  }

  /* Metrics line */
  .metrics-line {
    font-size: 0.72rem; color: var(--fg-muted); margin-top: 4px;
    padding: 4px 8px; font-family: var(--font-mono);
  }

  /* ========== Upload Button ========== */
  .upload-btn {
    padding: 6px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--fg-muted);
    font-size: 1.1rem;
    line-height: 1;
    border-radius: 6px;
    transition: all 0.15s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .upload-btn img {
    opacity: 0.75;
    transition: opacity 0.15s;
  }
  .upload-btn:hover img {
    opacity: 1;
  }
  .upload-btn:hover {
    background: rgba(0,0,0,0.04);
    color: var(--fg-secondary);
  }
  .upload-btn:active {
    transform: scale(0.95);
  }
  .file-tag {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    margin: 6px 0 0;
    background: var(--bg-tertiary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    color: var(--fg-secondary);
    max-width: fit-content;
  }
  .file-tag.visible { display: inline-flex; }
  .file-tag .file-tag-name {
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-tag .file-tag-close {
    cursor: pointer;
    color: var(--fg-muted);
    font-size: 0.85rem;
    line-height: 1;
    padding: 0 2px;
  }
  .file-tag .file-tag-close:hover { color: #ff3b30; }

  /* ========== Auth Overlay ========== */
  .auth-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.6);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
  }

  .auth-card {
    width: 360px;
    padding: 40px 36px 32px;
    background: var(--bg);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    border: 0.5px solid var(--border-light);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .auth-card .auth-logo {
    text-align: center;
    margin-bottom: 4px;
  }
  .auth-card .auth-logo-icon {
    display: inline-flex;
    width: 48px;
    height: 48px;
    background: var(--fg);
    border-radius: var(--radius-md);
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 500;
  }
  .auth-title {
    font-family: var(--font-display);
    text-align: center;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.01em;
  }
  .auth-input {
    padding: 10px 14px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    font-family: inherit;
    background: var(--bg-tertiary);
    color: var(--fg);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .auth-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201,100,66,0.1);
    background: var(--bg);
  }
  .auth-input::placeholder {
    color: var(--fg-muted);
  }
  .auth-error {
    font-size: 0.8rem;
    color: #ff3b30;
    text-align: center;
    min-height: 1.2em;
  }
  .auth-btn {
    padding: 10px;
    background: var(--fg);
    color: white;
    border: none;
    border-radius: var(--radius-pill);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .auth-btn:hover:not(:disabled) {
    background: #333336;
    transform: scale(1.01);
  }
  .auth-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .auth-switch {
    text-align: center;
    font-size: 0.8rem;
    color: var(--fg-muted);
  }
  .auth-switch a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }
  .auth-switch a:hover {
    text-decoration: underline;
  }

  /* ========== Header user display ========== */
  .user-name {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--fg);
  }
  .logout-btn {
    padding: 4px 12px;
    background: transparent;
    color: var(--fg-muted);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .logout-btn:hover {
    border-color: #ff3b30;
    color: #ff3b30;
  }

  /* ========== Welcome State ========== */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 32px 80px;
    gap: 20px;
  }

  .welcome-title {
    font-family: var(--font-display);
    font-size: 1.65rem;
    font-weight: 600;
    color: var(--fg);
    letter-spacing: -0.02em;
    text-align: center;
  }
  .welcome-input-area {
    width: 100%;
    max-width: 680px;
  }
  .welcome-input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 6px 6px 6px 20px;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 1px 6px rgba(0,0,0,0.04);
  }
  .welcome-input-wrap:focus-within {
    border-color: rgba(0,0,0,0.2);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .welcome-input-wrap textarea {
    flex: 1;
    padding: 6px 0;
    border: none;
    font-size: 0.93rem;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 24px;
    max-height: 120px;
    background: transparent;
    color: var(--fg);
    line-height: 1.5;
  }
  .welcome-input-wrap textarea::placeholder { color: var(--fg-muted); }
  .welcome-send-btn {
    width: 36px;
    height: 36px;
    background: var(--fg);
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .welcome-send-btn:hover { background: #333; }
  .welcome-icon {
    width: 72px;
    height: 72px;
    background: var(--bg-secondary);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
    color: var(--accent);
    box-shadow: 0 0 0 1px var(--border-light), 0 4px 24px rgba(201,100,66,0.06);
  }
  .welcome-icon svg { width: 42px; height: 42px; }
  .welcome-subtitle {
    font-size: 0.95rem;
    color: var(--fg-muted);
    text-align: center;
    margin-top: -8px;
  }
  .welcome-cards {
    display: flex;
    gap: 16px;
    max-width: 840px;
    width: 100%;
    margin-top: 12px;
  }
  .welcome-card {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 24px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .welcome-card:hover {
    border-color: var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .welcome-card-icon {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    background: var(--bg-tertiary);
    color: var(--fg-secondary);
  }
  .welcome-card-icon svg { width: 20px; height: 20px; }
  .welcome-card:hover .welcome-card-icon {
    color: var(--accent);
  }
  .welcome-card-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 8px;
  }
  .welcome-card-desc {
    font-size: 0.82rem;
    color: var(--fg-secondary);
    line-height: 1.5;
  }
  @media (max-width: 640px) {
    .welcome-cards { flex-direction: column; }
  }
  .welcome-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 680px;
    margin-top: 4px;
  }
  .welcome-suggestion {
    padding: 8px 16px;
    background: var(--bg-secondary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 0.8rem;
    color: var(--fg-secondary);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }
  .welcome-suggestion:hover {
    border-color: var(--fg-muted);
    color: var(--fg);
    background: var(--bg-tertiary);
  }

  /* ========== Opportunity View ========== */
  .opportunity {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .opp-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 32px;
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .opp-back-btn {
    padding: 6px 14px;
    background: var(--bg-tertiary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--fg-secondary);
    transition: all 0.2s;
    font-family: inherit;
    flex-shrink: 0;
  }
  .opp-back-btn:hover {
    border-color: var(--fg-muted);
    color: var(--fg);
  }
  .opp-title-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .opp-title {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.02em;
    margin: 0;
  }
  .opp-date {
    font-size: 0.78rem;
    color: var(--fg-muted);
  }
  .opp-regen-btn {
    padding: 6px 16px;
    background: var(--fg);
    color: white;
    border: none;
    border-radius: var(--radius-pill);
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    flex-shrink: 0;
  }
  .opp-regen-btn:hover:not(:disabled) {
    background: #333336;
    transform: scale(1.02);
  }
  .opp-regen-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .opp-content {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
  }
  .opp-content-inner {
    max-width: 800px;
    margin: 0 auto;
  }
  .opp-loading {
    color: var(--fg-muted);
    font-size: 0.85rem;
  }
  .opp-loading::after {
    content: '';
    animation: dots 1.5s steps(3) infinite;
  }
  .opp-article {
    font-size: 0.92rem;
    line-height: 1.8;
    color: var(--fg);
    letter-spacing: 0.01em;
  }
  .opp-article p { margin: 0.6em 0; }
  .opp-article p:first-child { margin-top: 0; }
  .opp-article h1, .opp-article h2, .opp-article h3 {
    font-family: var(--font-display);
    letter-spacing: -0.02em;
    margin: 1.2em 0 0.4em;
    color: var(--fg);
  }
  .opp-article h1 { font-size: 1.4rem; }
  .opp-article h2 { font-size: 1.15rem; }
  .opp-article h3 { font-size: 1rem; }
  .opp-article code {
    background: rgba(0,0,0,0.05);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.82rem;
    font-family: var(--font-mono);
  }
  .opp-article pre {
    background: #1d1d1f;
    color: #d4d4d4;
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    margin: 10px 0;
    font-size: 0.82rem;
    line-height: 1.7;
  }
  .opp-article pre code { background: none; padding: 0; color: inherit; }
  .opp-article ul, .opp-article ol { margin: 0.5em 0; padding-left: 1.5em; }
  .opp-article li { margin: 0.2em 0; }
  .opp-article table { border-collapse: collapse; margin: 10px 0; font-size: 0.82rem; width: 100%; }
  .opp-article th, .opp-article td { border: 0.5px solid var(--border); padding: 6px 10px; text-align: left; }
  .opp-article th { background: var(--bg-tertiary); font-weight: 600; }
  .opp-article img { max-width: 100%; height: auto; border-radius: var(--radius-sm); margin: 8px 0; display: block; }
  .opp-article a { color: var(--accent); text-decoration: none; }
  .opp-article a:hover { text-decoration: underline; }
  .opp-article blockquote {
    border-left: 3px solid var(--border);
    padding-left: 14px;
    color: var(--fg-secondary);
    margin: 0.6em 0;
  }
  .opp-article hr { border: none; border-top: 0.5px solid var(--border); margin: 1.2em 0; }

  /* ========== Image Preview Bar ========== */
  .image-preview-bar {
    display: none;
    gap: 8px;
    padding: 8px 12px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .image-preview-bar.visible { display: flex; }
  .image-preview-item {
    position: relative;
    display: inline-block;
    flex-shrink: 0;
  }
  .image-preview-item img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .image-preview-item .image-remove {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ff3b30;
    color: #fff;
    border: none;
    font-size: 12px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    padding: 0;
  }
  .image-preview-item .image-remove:hover { background: #d32f2f; }
  .image-uploading {
    opacity: 0.5;
    pointer-events: none;
  }

  /* ========== Flow Timeline Panel ========== */
  .todo-panel {
    margin-bottom: 12px;
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    font-size: 12px;
    box-shadow: 0 0 0 1px var(--border-light);
  }
  .todo-panel-title {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    letter-spacing: 0;
    margin-bottom: 12px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
    color: var(--fg-secondary);
    line-height: 1.5;
    position: relative;
  }
  /* 左侧 timeline 竖线 */
  .todo-item:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 7px;
    top: 26px;
    bottom: -7px;
    width: 1px;
    background: var(--border-light);
  }
  .todo-item[data-status="completed"]:not(:last-child)::after {
    background: var(--ring);
    opacity: 0.6;
  }
  .todo-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    z-index: 1;
  }
  .todo-content { flex: 1; min-width: 0; }
  /* 右侧工具徽章 */
  .todo-tool-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-tertiary);
    color: var(--fg-secondary);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px var(--border-light);
  }
  .todo-tool-badge svg {
    width: 10px;
    height: 10px;
  }
  .todo-item[data-status="completed"] { color: var(--fg-muted); }
  .todo-item[data-status="completed"] .todo-content { text-decoration: line-through; text-decoration-color: var(--ring); }
  .todo-item[data-status="completed"] .todo-icon { color: #7a8a6f; }  /* muted sage green */
  .todo-item[data-status="in_progress"] { color: var(--fg); font-weight: 500; }
  .todo-item[data-status="in_progress"] .todo-icon { color: var(--accent); }
  .todo-item[data-status="pending"] .todo-icon { color: var(--fg-muted); }
  @keyframes todo-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .todo-item[data-status="in_progress"] .todo-icon { animation: todo-pulse 1.5s ease-in-out infinite; }

  /* ===== Ask User Option Cards ===== */
  .ask-panel {
    margin-top: 12px;
    padding: 0;
  }
  .ask-panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 10px;
  }
  .ask-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 1.5px solid var(--border-light);
    border-radius: var(--radius-md);
    background: #fff;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .ask-option:last-child { margin-bottom: 0; }
  .ask-option:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201,100,66,.08);
  }
  .ask-option-radio {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    flex-shrink: 0;
  }
  .ask-option-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
  }
  .ask-option-desc {
    font-size: 12px;
    color: var(--fg-secondary);
    margin-top: 2px;
  }

  /* ===== Action Cards (upload_request / checkbox_select / radio_select) ===== */
  .action-cards-wrap { margin: 14px 0 4px; }
  /* Upload request — drag-drop style dashed area */
  .action-upload {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 32px 20px;
    border: 2.5px dashed #8e8e93;
    border-radius: 12px;
    background: #f0f4f8;
    cursor: pointer;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .action-upload:hover {
    border-color: #5856d6;
    background: #e8ecf2;
    box-shadow: 0 2px 12px rgba(88,86,214,.1);
  }
  .action-upload-icon {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .action-upload-icon svg { width: 22px; height: 22px; stroke: #5856d6; }
  .action-upload-text {
    font-size: 14px; font-weight: 600; color: #3a3a3c;
    text-align: center; line-height: 1.5;
  }
  .action-upload-text .browse { color: #5856d6; text-decoration: underline; }
  .action-upload-hint {
    font-size: 12px; color: #8e8e93; margin-top: -4px;
  }
  /* Select — pill button style */
  .action-select-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
  }
  .action-select-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 2px;
  }
  /* Pill button — radio (single select) */
  .action-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 999px;
    border: none;
    background: rgba(201,100,66,.08);
    color: #c96442;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
    white-space: nowrap;
  }
  .action-pill:hover {
    background: rgba(201,100,66,.15);
    box-shadow: 0 2px 8px rgba(201,100,66,.12);
  }
  .action-pill:active { background: rgba(201,100,66,.22); }
  .action-pill .arrow { font-size: 13px; opacity: .7; }
  /* Checkbox card style */
  .action-check-group {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .action-check-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 1.5px solid var(--border-light);
    border-radius: var(--radius-md);
    background: #fff;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s, background .15s;
    margin-bottom: 8px;
  }
  .action-check-card:last-of-type { margin-bottom: 0; }
  .action-check-card:hover {
    border-color: #5856d6;
    box-shadow: 0 0 0 3px rgba(88,86,214,.08);
    background: rgba(88,86,214,.02);
  }
  .action-check-card.selected {
    border-color: #5856d6;
    background: rgba(88,86,214,.05);
  }
  .action-check-box {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid #d1d1d6;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, background .15s;
  }
  .action-check-card.selected .action-check-box {
    border-color: #5856d6;
    background: #5856d6;
  }
  .action-check-box svg { width: 14px; height: 14px; display: none; }
  .action-check-card.selected .action-check-box svg { display: block; }
  .action-check-info { flex: 1; min-width: 0; }
  .action-check-info .action-item-title {
    font-size: 14px; font-weight: 600; color: var(--fg);
  }
  .action-check-info .action-item-desc {
    font-size: 12px; color: var(--fg-secondary); margin-top: 3px;
  }
  /* Confirm button (checkbox mode) */
  .action-confirm-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 12px 0;
    border: none;
    border-radius: var(--radius-md);
    background: #5856d6;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
    text-align: center;
  }
  .action-confirm-btn:hover { opacity: .85; }
  .action-confirm-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ===== Collapsible action-cards ===== */
  .action-collapsible-wrap { margin: 14px 0 4px; }
  .action-collapsible-header { font-family: var(--font-display); font-weight: 500; font-size: 15px; color: var(--fg); margin-bottom: 8px; }
  .action-collapsible-toggle { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; transition: background .2s; }
  .action-collapsible-toggle:hover { background: var(--bg-tertiary); }
  .action-collapsible-toggle.open { border-radius: var(--radius-md) var(--radius-md) 0 0; border-bottom: none; }
  .action-collapsible-title { font-family: var(--font-display); font-weight: 500; font-size: 14px; color: var(--fg); }
  .action-collapsible-arrow { font-size: 12px; color: var(--accent); }
  .action-collapsible-body { padding: 16px; border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-md) var(--radius-md); background: var(--bg-secondary); line-height: 1.7; font-size: 14px; color: var(--fg-secondary); }
  .action-collapsible-body.collapsed { display: none; }

  /* ===== Amazon Product Card (tool result) ===== */
  .amz-products { display:flex; flex-direction:column; gap:14px; margin-top:8px; }
  .amz-card { background:#fff; border-radius:12px; border:1px solid var(--border-light); overflow:hidden; box-shadow:var(--shadow-sm); }
  .amz-card .amz-section { padding:12px 16px; border-bottom:1px solid rgba(0,0,0,.05); }
  .amz-card .amz-section:last-child { border-bottom:none; }
  .amz-card .amz-sec-label { font-size:10px; font-weight:600; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  .amz-card .amz-title { font-size:13px; font-weight:600; line-height:1.4; margin-bottom:8px; }
  .amz-card .amz-title a { color:inherit; text-decoration:none; }
  .amz-card .amz-title a:hover { color:var(--accent); }
  .amz-card .amz-meta { display:flex; flex-wrap:wrap; gap:4px 10px; margin-bottom:8px; font-size:11px; color:var(--fg-muted); }
  .amz-card .amz-meta strong { color:var(--fg); font-weight:500; }
  .amz-card .amz-price { font-size:18px; font-weight:700; color:#b12704; margin-bottom:8px; }
  .amz-card .amz-badges { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
  .amz-card .amz-badge { font-size:10px; font-weight:600; padding:2px 6px; border-radius:4px; }
  .amz-card .amz-badge-stock { background:#eafaf1; color:#1e8449; }
  .amz-card .amz-cat { font-size:10px; color:var(--fg-muted); }
  .amz-card .amz-cat a { color:var(--fg-secondary); text-decoration:none; }
  .amz-card .amz-cat a:hover { color:var(--accent); }
  .amz-card .amz-attrs { display:flex; flex-wrap:wrap; gap:6px; }
  .amz-card .amz-chip { display:inline-flex; align-items:center; gap:4px; background:var(--bg-tertiary); border:1px solid var(--border-light); border-radius:5px; padding:3px 8px; font-size:11px; }
  .amz-card .amz-chip .ck { color:var(--fg-muted); font-weight:500; }
  .amz-card .amz-chip .cv { color:var(--fg); font-weight:500; }
  .amz-card .amz-gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:6px; }
  .amz-card .amz-gal-item { background:#fff; border:1px solid var(--border-light); border-radius:6px; aspect-ratio:1; overflow:hidden; cursor:pointer; transition:border-color .15s; position:relative; }
  .amz-card .amz-gal-item:hover { border-color:var(--accent); }
  .amz-card .amz-gal-item img { width:100%; height:100%; object-fit:contain; padding:4px; }

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const sessionEl = document.getElementById('sessionId');
let bridgeBootstrap = null;

// Opportunity view elements
const oppEl = document.getElementById('opportunity');
const oppArticleEl = document.getElementById('oppArticle');
const oppLoadingEl = document.getElementById('oppLoading');
const oppDateEl = document.getElementById('oppDate');
const oppRegenBtn = document.getElementById('oppRegenBtn');
let oppStreaming = false;
let previousView = 'welcome';
let oppAbortController = null;

// ========== Auth ==========
let authMode = 'login';

function toggleAuthMode(e) {
  e.preventDefault();
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('authTitle').textContent = authMode === 'login' ? '登录' : '注册';
  document.getElementById('authBtn').textContent = authMode === 'login' ? '登录' : '注册';
  document.getElementById('authSwitchText').textContent = authMode === 'login' ? '还没有账号？' : '已有账号？';
  document.getElementById('authSwitchLink').textContent = authMode === 'login' ? '注册' : '登录';
  document.getElementById('authError').textContent = '';
}

async function authSubmit() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const errorEl = document.getElementById('authError');
  errorEl.textContent = '';

  if (!username || !password) {
    errorEl.textContent = '请输入用户名和密码';
    return;
  }

  const btn = document.getElementById('authBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/' + authMode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.detail || '操作失败';
      return;
    }
    localStorage.setItem('evoagent_user', data.username);
    enterApp(data.username);
  } catch (err) {
    errorEl.textContent = '网络错误: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}

async function syncBridgeState(username, sessionId) {
  if (!bridgeBootstrap || !bridgeBootstrap.bridge) return;
  try {
    await fetch('/api/bridge/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username || '', session_id: sessionId || '' }),
    });
  } catch (e) {}
}

async function enterApp(username) {
  document.getElementById('userId').value = username;
  document.getElementById('userName').textContent = username;
  document.getElementById('authOverlay').classList.add('hidden');
  document.getElementById('welcomeTitle').textContent = '你好，我是 EvoAgent';
  if (!sessionEl.value) {
    sessionEl.value = Math.random().toString(36).slice(2, 10);
  }
  await syncBridgeState(username, sessionEl.value);
  showWelcome();
  const hasHistory = await loadSessions();
  loadSidebarFiles();
  loadSidebarTasks();
  startTaskScheduler();
  requestNotificationPermission();
}

async function logout() {
  if (bridgeBootstrap && bridgeBootstrap.bridge) {
    try {
      await fetch('/api/bridge/logout', { method: 'POST' });
    } catch (e) {}
  }
  localStorage.removeItem('evoagent_user');
  document.getElementById('userId').value = '';
  document.getElementById('userName').textContent = '';
  document.getElementById('authOverlay').classList.remove('hidden');
  chatEl.textContent = '';
  sessionEl.value = '';

  document.getElementById('welcomeTitle').textContent = '你好，我是 EvoAgent';
  document.getElementById('authUsername').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authError').textContent = '';

}

// Initialize marked.js with GFM (tables, strikethrough, etc.)
if (typeof marked !== 'undefined') {
  marked.use({ gfm: true, breaks: false });
}

function renderMarkdown(text) {
  if (!text) return '';
  // Fix setext heading: ensure standalone --- lines (not table separators) get blank line before
  text = text.replace(/([^\n|])\n(---+)\s*\n/g, '$1\n\n$2\n');

  // Extract ```action-cards ... ``` code blocks into placeholders
  const _actions = [];
  text = text.replace(/```action-cards\s*\n([\s\S]*?)```/g, function(_, inner) {
    try {
      var obj = JSON.parse(inner.trim());
      _actions.push(obj);
      return 'EVACARD' + (_actions.length - 1) + 'EVACARD';
    } catch(e) { return _; }
  });

  // Extract image URLs into placeholders to survive DOMPurify sanitization
  const _imgs = [];
  const _ph = (u) => { _imgs.push(u); return 'EVIMG' + (_imgs.length - 1) + 'EVIMG'; };
  // 1. Backtick-wrapped: `url.png`
  text = text.replace(/`(https?:\/\/[^`\s]+\.(?:png|jpe?g|gif|webp|svg|bmp))`/gi, (_, u) => _ph(u));
  // 2. Markdown image: ![alt](url.png)
  text = text.replace(/!\[([^\]]*)\]\((https?:\/\/[^)]+\.(?:png|jpe?g|gif|webp|svg|bmp))\)/gi, (_, a, u) => _ph(u));
  // 3. Bare URLs
  text = text.replace(/(?<![(\[`])\b(https?:\/\/[^\s\[\]()]+\.(?:png|jpe?g|gif|webp|svg|bmp))\b/gi, (_, u) => _ph(u));

  let html;
  if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
    html = DOMPurify.sanitize(marked.parse(text));
  } else if (typeof marked !== 'undefined') {
    html = marked.parse(text);
  } else {
    html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }
  // Re-insert images as <img> tags (placeholders survived sanitization as plain text)
  html = html.replace(/EVIMG(\d+)EVIMG/g, (_, i) => {
    const u = _imgs[+i];
    if (!u || !/^https?:\/\//i.test(u)) return '';
    const safe = u.replace(/[<>"]/g, '');
    return '<img src="' + safe + '" alt="image">';
  });
  // Re-insert action cards as interactive components
  html = html.replace(/EVACARD(\d+)EVACARD/g, (_, i) => {
    const ac = _actions[+i];
    if (!ac) return '';
    const esc = s => (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const uid = 'ac' + Date.now() + '_' + i;

    if (ac.type === 'upload_request') {
      var msg = esc(ac.message || '');
      return '<div class="action-cards-wrap"><div class="action-upload" onclick="document.getElementById(\'imageInput\').click()">' +
        '<div class="action-upload-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>' +
        '<div class="action-upload-text">拖拽图片到此处 或 <span class="browse">点击上传</span></div>' +
        (msg ? '<div class="action-upload-hint">' + msg + '</div>' : '') +
        '</div></div>';
    }

    var checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

    if (ac.type === 'checkbox_select') {
      var items = (ac.list || []).map(function(item, idx) {
        return '<div class="action-check-card" data-group="' + uid + '" data-idx="' + idx + '" onclick="toggleActionCheck(this)">' +
          '<div class="action-check-box">' + checkSvg + '</div>' +
          '<div class="action-check-info"><div class="action-item-title">' + esc(item.title) + '</div>' +
          (item.description ? '<div class="action-item-desc">' + esc(item.description) + '</div>' : '') +
          '</div></div>';
      }).join('');
      return '<div class="action-cards-wrap">' +
        (ac.message ? '<div class="action-select-title">' + esc(ac.message) + '</div>' : '') +
        '<div class="action-check-group" id="' + uid + '">' + items + '</div>' +
        '<button class="action-confirm-btn" onclick="confirmActionCards(\'' + uid + '\')">确认生成（已选 0 项）</button></div>';
    }

    if (ac.type === 'radio_select') {
      var items = (ac.list || []).map(function(item) {
        var safeTitle = esc(item.title).replace(/'/g, "\\'");
        return '<div class="action-pill" onclick="sendActionCard(\'' + safeTitle + '\')">' +
          '<span>' + esc(item.title) + '</span>' +
          '<span class="arrow">→</span></div>';
      }).join('');
      return '<div class="action-cards-wrap">' +
        (ac.message ? '<div class="action-select-title">' + esc(ac.message) + '</div>' : '') +
        '<div class="action-select-group">' + items + '</div></div>';
    }

    if (ac.type === 'collapsible') {
      var items = (ac.list || []).map(function(item, idx) {
        var bodyId = uid + '_body_' + idx;
        var isOpen = item.defaultOpen === true;
        var descHtml = renderMarkdown(item.description || '');
        return '<div class="action-collapsible-item">' +
          '<div class="action-collapsible-toggle' + (isOpen ? ' open' : '') + '" onclick="toggleCollapsible(this)">' +
          '<span class="action-collapsible-title">' + esc(item.title || '') + '</span>' +
          '<span class="action-collapsible-arrow">' + (isOpen ? '▲' : '▼') + '</span>' +
          '</div>' +
          '<div class="action-collapsible-body' + (isOpen ? '' : ' collapsed') + '" id="' + bodyId + '">' +
          descHtml +
          '</div></div>';
      }).join('');
      return '<div class="action-cards-wrap action-collapsible-wrap">' +
        (ac.message ? '<div class="action-collapsible-header">' + esc(ac.message) + '</div>' : '') +
        items + '</div>';
    }
    return '';
  });
  return html;
}

function toolResultSummary(name, result) {
  if (!result) return '';

  if (name === 'html_render') return 'HTML 页面已生成';
  if (name === 'amazonscraper') {
    try {
      var arr = typeof result === 'string' ? JSON.parse(result) : result;
      if (Array.isArray(arr)) return '抓取到 ' + arr.length + ' 个产品';
    } catch {}
    return '抓取完成';
  }
  if (name === 'websearch') {
    var count = (text.match(/---/g) || []).length;
    if (count > 0) return '找到 ' + count + ' 条结果';
    if (text.length > 20) return '搜索完成';
  }
  if (name === 'fetchurl' || name === 'fetch_url') {
    try {
      var arr2 = typeof result === 'string' ? JSON.parse(result) : result;
      if (Array.isArray(arr2) && arr2.length && arr2[0].product_title) return '抓取到 ' + arr2.length + ' 个产品';
    } catch {}
    if (text.length > 20) return '抓取完成';
  }
  if (name === 'update_user_profile') {
    try {
      var r = typeof result === 'string' ? JSON.parse(result) : result;
      if (r.fields) {
        return '已' + (r.action || '更新') + ' ' + Object.keys(r.fields).join('、');
      }
    } catch {}
    var m = text.match(/已(?:追加|更新)字段[：:]\s*(.+)/);
    if (m) return m[0];
  }
  return '';
}

function toolInputSummary(name, args) {

  switch (name) {
    case 'websearch': return (a.query || a.keyword || a.search_query || '');

  var spec = '';

    + '<div class="amz-section">'
    + '<div class="amz-title"><a href="'+amzEsc(p.product_url)+'" target="_blank">'+amzEsc(p.product_title)+'</a></div>'
    + '<div class="amz-meta">'
    + (brand ? '<span>品牌 <strong>'+amzEsc(brand)+'</strong></span>' : '')
    + '<span>ASIN <strong>'+amzEsc(p.asin)+'</strong></span>'
    + '<span>来源 <strong>Amazon US</strong></span>'
    + '</div>'

    + '</div>'
    + (chips ? '<div class="amz-section"><div class="amz-sec-label">产品属性</div><div class="amz-attrs">'+chips+'</div></div>' : '')

    + '<div class="amz-tab-nav" data-amztabs="'+cid+'"><button class="active">产品信息</button><button>规格参数</button><button>产品描述</button></div>'

    + '<div class="amz-tab-panel active">'+bullets+'</div>'
    + '<div class="amz-tab-panel">'+spec+'</div>'
    + '<div class="amz-tab-panel">'+desc+'</div>'
    + '</div>'
    + '</div>';

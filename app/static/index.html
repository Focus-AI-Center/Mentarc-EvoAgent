// ===== MIC Product Card Rendering =====
function isMicProduct(p) {
  return p.source === 'mic' || !!(p.company_intro || (p.faq && p.faq.length));
}

function micPriceText(p) {
  var pr = p.product_price;
  if (!pr) return '';
  if (typeof pr === 'object' && pr.min != null) {
    var cur = pr.currency || 'USD';
    return pr.min === pr.max
      ? '$' + pr.min.toFixed(0) + ' ' + cur
      : '$' + pr.min.toFixed(0) + ' - $' + pr.max.toFixed(0) + ' ' + cur;
  }
  return String(pr);
}

function micExtractTags(p) {
  var tags = [];
  var info = p.product_information || {};
  if (info['Control']) tags.push(info['Control']);
  var hl = p.company_highlights || [];
  if (hl.some(function(h){return /OEM|ODM/.test(h);}) || info['OEM&ODM']) tags.push('OEM & ODM');
  var cert = info['Certification'] || '';
  if (!cert) hl.forEach(function(h){ if (!cert && (/CE|FCC|CB/.test(h))) cert = h; });
  if (cert) tags.push(cert.replace(/Certified and Approved/i,'').trim().replace(/\.$/,''));
  if (info['Max Load Weight']) tags.push(info['Max Load Weight'] + ' Max Load');
  if (info['Applicable Height']) tags.push(info['Applicable Height']);
  if (info['Production Capacity']) tags.push(info['Production Capacity']);
  return tags.slice(0, 6);
}

function micCleanHighlights(hl) {
  return (hl || []).filter(function(h) {
    return !/Have a revolutionary|Explore More|Reach out/i.test(h);
  }).slice(0, 4);
}

function renderMicProductCard(p, idx) {
  var cid = 'mic-card-' + idx;
  var priceText = micPriceText(p);
  var supplier = p.supplier_info || {};
  var companyName = amzEsc(supplier.company_name || '');
  var companyUrl = supplier.company_url || '';

  var cats = (p.category_path || []);
  var shortCats = cats.length > 3 ? [cats[0], cats[2], cats[3]] : cats;
  var catHtml = shortCats.map(function(c) {
    return c.name ? '<span class="mic-cat-tag">' + amzEsc(c.name) + '</span>' : '';
  }).join('');

  var gallery = '';
  if (p.product_photos && p.product_photos.length) {
    gallery = '<div class="mic-gallery">' + p.product_photos.map(function(url, i) {
      return '<img src="'+amzEsc(url)+'" alt="'+(i+1)+'" loading="lazy" onclick="openAmzLightbox(\''+amzEsc(url)+'\')">';
    }).join('') + '</div>';
  }

  var tags = micExtractTags(p);
  var tagsHtml = tags.length ? '<div class="mic-tags">' + tags.map(function(t) {
    return '<span class="mic-tag">' + amzEsc(t) + '</span>';
  }).join('') + '</div>' : '';

  // Tab 1: 竞品摘要
  var info = p.product_information || {};
  var summaryKeys = ['Type','Function','Voltage','Control','Applicable Height','Max Load Weight','Running Time','Certification','Production Capacity','OEM&ODM'];
  var summaryHtml = '';
  summaryKeys.forEach(function(k) {
    if (info[k]) summaryHtml += '<div class="mic-summary-item"><span class="mic-sl">'+amzEsc(k)+'</span> <span class="mic-sv">'+amzEsc(info[k])+'</span></div>';
  });
  var cleanHl = micCleanHighlights(p.company_highlights);
  if (cleanHl.length) {
    summaryHtml += '<div style="margin-top:10px"><span class="mic-sl">公司亮点</span></div>';
    summaryHtml += '<div class="mic-hl-group" style="margin-top:4px">' + cleanHl.map(function(h) { return '<span class="mic-hl-tag">'+amzEsc(h)+'</span>'; }).join('') + '</div>';
  }

  // Tab 2: 关键规格
  var specHtml = '';
  if (Object.keys(info).length) {
    specHtml = '<table class="mic-spec-table">' + Object.entries(info).map(function(kv) {
      return '<tr><td>'+amzEsc(kv[0])+'</td><td>'+amzEsc(kv[1])+'</td></tr>';
    }).join('') + '</table>';
  } else {
    specHtml = '<p style="color:var(--fg-muted);font-size:12px">暂无规格数据</p>';
  }

  // Tab 3: 公司与FAQ
  var companyHtml = '';
  if (p.company_intro) {
    companyHtml += '<p class="mic-company-intro">' + amzEsc(p.company_intro) + '</p>';
  }
  if (cleanHl.length) {
    companyHtml += '<div class="mic-hl-group">' + cleanHl.map(function(h) { return '<span class="mic-hl-tag">'+amzEsc(h)+'</span>'; }).join('') + '</div>';
  }
  var faqItems = p.faq || [];
  if (faqItems.length) {
    var faqPreview = faqItems.slice(0, 3);
    var faqRest = faqItems.slice(3);
    faqPreview.forEach(function(f) {
      companyHtml += '<div class="mic-faq-item open"><div class="mic-faq-q" onclick="this.parentElement.classList.toggle(\'open\')">' + amzEsc(f.question) + '</div><div class="mic-faq-a">' + amzEsc(f.answer).replace(/\n/g,'<br>') + '</div></div>';
    });
    if (faqRest.length) {
      companyHtml += '<div class="mic-faq-rest" style="display:none">';
      faqRest.forEach(function(f) {
        companyHtml += '<div class="mic-faq-item"><div class="mic-faq-q" onclick="this.parentElement.classList.toggle(\'open\')">' + amzEsc(f.question) + '</div><div class="mic-faq-a">' + amzEsc(f.answer).replace(/\n/g,'<br>') + '</div></div>';
      });
      companyHtml += '</div>';
      companyHtml += '<div class="mic-faq-more" data-mic-faq-more="1">查看更多 FAQ (' + faqRest.length + '条)</div>';
    }
  }

  return '<div class="mic-card" id="'+cid+'">'
    + '<div class="mic-header">'
    + '<div class="mic-title"><a href="'+amzEsc(p.product_url)+'" target="_blank">'+amzEsc(p.product_title)+'</a></div>'
    + '<div class="mic-meta-row">'
    + '<span class="mic-price">'+amzEsc(priceText)+'</span>'
    + '<span class="mic-supplier">' + (companyUrl ? '<a href="'+amzEsc(companyUrl)+'" target="_blank">'+companyName+'</a>' : companyName) + '</span>'
    + '</div>'
    + (catHtml ? '<div class="mic-cat-row">'+catHtml+'</div>' : '')
    + '</div>'
    + gallery
    + tagsHtml
    + '<div class="mic-tab-nav" data-mictabs="'+cid+'"><button class="active">竞品摘要</button><button>关键规格</button><button>公司与FAQ</button></div>'
    + '<div class="mic-tab-body">'
    + '<div class="mic-tab-panel active">'+summaryHtml+'</div>'
    + '<div class="mic-tab-panel">'+specHtml+'</div>'
    + '<div class="mic-tab-panel">'+companyHtml+'</div>'
    + '</div>'
    + '</div>';
}

function renderMicProducts(products) {
  var html = '<div class="amz-products">';
  products.forEach(function(p, i) { html += renderMicProductCard(p, i); });
  html += '</div>';
  return html;
}

function bindMicTabs(container) {
  container.querySelectorAll('.mic-tab-nav').forEach(function(nav) {
    nav.addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var btns = Array.from(nav.querySelectorAll('button'));
      var idx = btns.indexOf(btn);
      btns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      var card = nav.closest('.mic-card') || nav.parentElement;
      var panels = Array.from(card.querySelectorAll('.mic-tab-panel'));
      panels.forEach(function(p, i){ p.classList.toggle('active', i === idx); });
    });
  });
  container.querySelectorAll('.mic-faq-more').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var rest = btn.previousElementSibling;
      if (rest && rest.classList.contains('mic-faq-rest')) {
        var visible = rest.style.display !== 'none';
        rest.style.display = visible ? 'none' : 'block';
        btn.textContent = visible ? '查看更多 FAQ' : '收起';
      }
    });
  });
}

function renderAmzProducts(products) {
  var html = '<div class="amz-products">';
  products.forEach(function(p, i) { html += renderAmzProductCard(p, i); });
  html += '</div>';
  return html;
}

function bindAmzTabs(container) {
  container.querySelectorAll('.amz-tab-nav').forEach(function(nav) {
    nav.addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var btns = Array.from(nav.querySelectorAll('button'));
      var idx = btns.indexOf(btn);
      btns.forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      var card = nav.closest('.amz-card') || nav.parentElement;
      var panels = Array.from(card.querySelectorAll('.amz-tab-panel'));
      panels.forEach(function(p,i){p.classList.toggle('active', i===idx);});
    });
  });
}

// ===== Replication Report Detection & Rendering =====
var REPL_SEC_RE = /^## (?:\d+\.|[一二三四五六七八九十]+[、．.])/m;
var REPL_SEC_SPLIT_RE = /^(?=## (?:\d+\.|[一二三四五六七八九十]+[、．.]))/m;
var REPL_SEC_HEAD_RE = /^## (?:\d+\.|[一二三四五六七八九十]+[、．.])\s*(.+)$/m;

function isReplicationReport(text) {
  if (!text) return false;
  var matches = text.match(/^## (?:\d+\.|[一二三四五六七八九十]+[、．.])/gm);
  return matches && matches.length >= 3;
}

function renderReplicationReport(rawText) {
  var titleMatch = rawText.match(/^# (.+)$/m);
  var reportTitle = titleMatch ? titleMatch[1].trim() : '竞品复刻与Listing优化报告';
  var subMatch = rawText.match(/^> (.+)$/m);
  var reportSub = subMatch ? subMatch[1].trim() : '';

  var sections = [];
  var sectionParts = rawText.split(REPL_SEC_SPLIT_RE);
  for (var i = 0; i < sectionParts.length; i++) {
    var part = sectionParts[i].trim();
    var headMatch = part.match(REPL_SEC_HEAD_RE);
    if (!headMatch) continue;
    var secTitle = headMatch[1].trim();
    var secBody = part.replace(REPL_SEC_HEAD_RE, '').trim();
    sections.push({ title: secTitle, body: secBody });
  }

  var footerMatch = rawText.match(/---\s*\n([\s\S]*?)$/);
  var footerHtml = '';
  if (footerMatch) {
    var footerText = footerMatch[1].trim();
    footerHtml = '<div class="repl-footer">' + renderMarkdown(footerText) + '</div>';
  }

  var html = '<div class="repl-report">';
  html += '<div class="repl-header"><h1>' + amzEsc(reportTitle) + '</h1>';
  if (reportSub) html += '<div class="repl-sub">' + amzEsc(reportSub) + '</div>';
  html += '</div>';

  sections.forEach(function(sec, idx) {
    if (idx === 1) {
      html += '<button class="repl-fold-toggle" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'visible\')">';
      html += '<span class="fold-arrow">▼</span> 查看完整复刻结果';
      html += '</button>';
      html += '<div class="repl-fold-body">';
      html += '<div class="repl-section">';
      html += '<div class="repl-sec-title">' + amzEsc(sec.title) + '</div>';
      html += '<div class="repl-body">' + renderMarkdown(sec.body) + '</div>';
      html += '</div></div>';
    } else {
      html += '<div class="repl-section">';
      html += '<div class="repl-sec-title">' + amzEsc(sec.title) + '</div>';
      html += '<div class="repl-body">' + renderMarkdown(sec.body) + '</div>';
      html += '</div>';
    }
  });

  html += footerHtml;
  html += '</div>';
  return html;
}

function getToolTags(bubble) {
  const msgDiv = bubble.parentElement || bubble;
  let container = msgDiv.querySelector('.tool-tags');
  if (!container) {
    container = document.createElement('div');
    container.className = 'tool-tags';
    msgDiv.insertBefore(container, bubble);
  }
  return container;
}

function addToolCall(bubble, id, name, args) {
  const container = getToolTags(bubble);
  const card = document.createElement('div');
  card.className = 'tool-card pending';
  card.dataset.toolName = name;
  card.dataset.toolId = id || '';
  card.innerHTML =
    '<span class="tool-icon">' + toolIcon(name) + '</span>' +
    '<span class="tool-label">' + toolLabel(name) + '</span>' +
    '<span class="tool-desc">' + (toolInputSummary(name, args) || '调用中…') + '</span>' +
    '<div class="tool-output"></div>';
  container.appendChild(card);
  scrollToBottom();
}

function addToolResult(bubble, id, name, result) {
  const container = getToolTags(bubble);
  // Match by id first, then fallback to name
  let card = id ? container.querySelector('.tool-card[data-tool-id="' + id + '"]') : null;
  if (!card) card = container.querySelector('.tool-card.pending[data-tool-name="' + name + '"]');
  if (!card) {
    card = document.createElement('div');
    card.className = 'tool-card';
    card.dataset.toolName = name;
    card.dataset.toolId = id || '';
    card.innerHTML =
      '<span class="tool-icon">' + toolIcon(name) + '</span>' +
      '<span class="tool-label">' + toolLabel(name) + '</span>' +
      '<span class="tool-desc"></span>' +
      '<div class="tool-output"></div>';
    container.appendChild(card);
  }
  // Update to done state
  card.classList.remove('pending');
  card.classList.add('done');
  // Update desc
  const desc = card.querySelector('.tool-desc');
  if (desc && (desc.textContent === '调用中…' || desc.textContent === '调用中...' || !desc.textContent)) {
    desc.textContent = toolResultSummary(name, result) || '完成';
  }
  // Fill output
  const output = card.querySelector('.tool-output');

  // Special: amazonscraper or fetch_url returning product arrays → render product cards
  if (name === 'amazonscraper' || name === 'fetch_url' || name === 'fetchurl') {
    try {
      var products = typeof result === 'string' ? JSON.parse(result) : result;
      if (Array.isArray(products) && products.length > 0 && products[0].product_title) {
        var previewHtml = null;
        if (products[0].__preview_html__) {
          previewHtml = products[0].__preview_html__;
          delete products[0].__preview_html__;
        }
        var useMic = isMicProduct(products[0]);
        output.innerHTML = useMic ? renderMicProducts(products) : renderAmzProducts(products);
        if (previewHtml) {
          var toggleBtn = document.createElement('button');
          toggleBtn.className = 'mic-preview-toggle';
          toggleBtn.innerHTML = '<span class="toggle-arrow">▼</span> 查看原始竞品详情结构';
          var frameWrap = document.createElement('div');
          frameWrap.className = 'mic-preview-frame';
          var iframe = document.createElement('iframe');
          iframe.sandbox = 'allow-same-origin allow-scripts';
          iframe.srcdoc = previewHtml;
          frameWrap.appendChild(iframe);
          output.appendChild(toggleBtn);
          output.appendChild(frameWrap);
          toggleBtn.onclick = function(e) {
            e.stopPropagation();
            toggleBtn.classList.toggle('open');
            frameWrap.classList.toggle('visible');
          };
        }
        card.classList.remove('done');
        card.classList.add('amz-expanded');
        var arrow = card.querySelector('.tool-collapse-arrow');
        if (!arrow) {
          arrow = document.createElement('span');
          arrow.className = 'tool-collapse-arrow';
          arrow.textContent = '▼';
          card.insertBefore(arrow, card.querySelector('.tool-output'));
        }
        card.onclick = function(e) {
          if (e.target.closest('.amz-tab, .amz-img-thumb, a, .mic-preview-toggle, .mic-tab-nav, .mic-faq-q, .mic-faq-more')) return;
          card.classList.toggle('amz-collapsed');
          arrow.textContent = card.classList.contains('amz-collapsed') ? '▶' : '▼';
        };
        if (useMic) bindMicTabs(output); else bindAmzTabs(output);
        scrollToBottom();
        return;
      }
    } catch(e) {}
  }

  // Special: update_user_profile → render updated field cards
  if (name === 'update_user_profile') {
    try {
      var prof = typeof result === 'string' ? JSON.parse(result) : result;
      if (prof.fields && typeof prof.fields === 'object') {
        var html = '<div class="profile-update-card">';
        for (var key in prof.fields) {
          var val = prof.fields[key] || '';
          var displayVal = val.length > 80 ? val.slice(0, 80) + '…' : val;
          html += '<div class="profile-field">'
            + '<span class="profile-field-name">' + amzEsc(key) + '</span>'
            + '<span class="profile-field-value">' + amzEsc(displayVal) + '</span>'
            + '</div>';
        }
        html += '</div>';
        output.innerHTML = html;
        card.onclick = function() { card.classList.toggle('expanded'); };
        scrollToBottom();
        return;
      }
    } catch(e) {}
  }

  const text = typeof result === 'string' ? result : JSON.stringify(result);
  if (output) output.textContent = text.length > 500 ? text.slice(0, 500) + '...' : text;
  card.onclick = function() { card.classList.toggle('expanded'); };
  scrollToBottom();
}

let sending = false;

// Flow timeline state — tracks which tools are associated with which todo step
let _pendingFlowTools = [];  // collect code 4 tool calls between todo updates
let _stepTools = {};         // stepId → [{icon, label}]

function renderTodoPanel(msgDiv, tasks) {
  let panel = msgDiv.querySelector('.todo-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.className = 'todo-panel';
    // Insert before bubble (message top)
    const bubble = msgDiv.querySelector('.bubble');
    if (bubble) {
      msgDiv.insertBefore(panel, bubble);
    } else {
      msgDiv.prepend(panel);
    }
    // 首次创建面板：清空 setup 阶段积累的工具（不关联到步骤）
    _pendingFlowTools = [];
  }

  // Associate pending tools with the active step
  var activeStep = tasks.find(function(t) { return t.status === 'in_progress'; }) ||
                   tasks.filter(function(t) { return t.status === 'completed'; }).pop();
  if (activeStep && _pendingFlowTools.length) {
    if (!_stepTools[activeStep.id]) _stepTools[activeStep.id] = [];
    _stepTools[activeStep.id].push.apply(_stepTools[activeStep.id], _pendingFlowTools);
    _pendingFlowTools = [];
  }

  var statusIcon = { completed: '\u2713', in_progress: '\u25E6', pending: '\u25CB' };
  var total = tasks.length;
  var done = tasks.filter(function(t) { return t.status === 'completed'; }).length;

  panel.innerHTML = '<div class="todo-panel-title">\u4EFB\u52A1\u8FDB\u5EA6 ' + done + '/' + total + '</div>' +
    tasks.map(function(t) {
      var tools = _stepTools[t.id] || [];
      var badges = tools.map(function(tool) {
        return '<span class="todo-tool-badge">' + tool.icon + '<span>' + tool.label + '</span></span>';
      }).join(' ');
      return '<div class="todo-item" data-status="' + (t.status || 'pending') + '">' +
        '<span class="todo-icon">' + (statusIcon[t.status] || '\u25CB') + '</span>' +
        '<span class="todo-content">' + (t.content || '') + '</span>' +
        badges +
      '</div>';
    }).join('');
  scrollToBottom();
}

function renderAskPanel(msgDiv, question, options) {
  if (msgDiv.querySelector('.ask-panel')) return;
  var panel = document.createElement('div');
  panel.className = 'ask-panel';
  var bubble = msgDiv.querySelector('.bubble');
  if (bubble) bubble.after(panel);
  else msgDiv.appendChild(panel);

  panel.innerHTML = '<div class="ask-panel-title">' + question + '</div>' +
    options.map(function(o) {
      var safeLabel = (o.label || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
      return '<div class="ask-option" onclick="useCard(\'' + safeLabel + '\')">' +
        '<div class="ask-option-radio"></div>' +
        '<div><div class="ask-option-label">' + (o.label || '') + '</div>' +
        (o.description ? '<div class="ask-option-desc">' + o.description + '</div>' : '') +
        '</div></div>';
    }).join('');
  scrollToBottom();
}

async function send() {
  const userText = inputEl.value.trim();
  const hasImages = attachedImages.length > 0;
  if ((!userText && !attachedFile && !hasImages) || sending) return;

  // Switch to chat view if on welcome screen
  if (!welcomeEl.classList.contains('hidden')) showChat();

  sending = true;
  sendBtn.disabled = true;
  _pendingFlowTools = [];
  _stepTools = {};
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // Capture images before clearing
  const imageFilenames = attachedImages.map(img => img.filename);
  const imageUrls = attachedImages.map(img => img.url);

  // Build the actual input sent to agent
  let text = '';
  let displayText = userText;
  if (attachedFile) {
    text = '[文件] ' + attachedFile.name + '\n\n' + attachedFile.content;
    if (userText) text += '\n\n---\n\n' + userText;
    displayText = '[\u6587\u4EF6] ' + attachedFile.name + (userText ? '\n' + userText : '');
    clearAttachment();
  } else {
    text = userText;
  }

  // Capture image URLs for display, then clear
  const displayImageUrls = hasImages ? [...imageUrls] : [];
  if (hasImages) clearImages();

  addUserMsg(displayText, displayImageUrls);
  const botDiv = createBotMsg();
  const bubble = botDiv.querySelector('.bubble');

  let rawText = '';

  try {
    const res = await fetch('/api/agent/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId: document.getElementById('userId').value || 'test',
        sessionId: sessionEl.value || 'default',
        requestId: Math.random().toString(36).slice(2, 10),
        data: { input: text, images: imageUrls },
      }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6);
        let event;
        try { event = JSON.parse(jsonStr); } catch { continue; }

        if (event.code === 2) {
          rawText += event.content;
          bubble.innerHTML = renderMarkdown(rawText);
          scrollToBottom();

        } else if (event.code === 3) {
          if (event.content === 'stream_start') {
            bubble.textContent = '思考中...';
          } else if (event.content === 'stream_end') {
            if (!rawText) {
              if (bubble.parentElement && bubble.parentElement.querySelector('.tool-tags')) {
                bubble.textContent = '';
              } else {
                bubble.textContent = '（无回复）';
              }
            }

            loadSessions();
            loadSidebarFiles();
          } else if (event.content.startsWith('error')) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'color:#ff3b30;margin-top:8px;font-size:0.82rem';
            errDiv.textContent = event.content;
            bubble.appendChild(errDiv);
          }

        } else if (event.code === 4) {
          let info;
          try { info = JSON.parse(event.content); } catch { info = { name: '?', arguments: event.content }; }
          if (info.name === 'todo_manager' || info.name === 'ask_user_question') continue;
          // skill_manager 是基础设施调用，不进入心流徽章
          if (info.name !== 'skill_manager') {
            _pendingFlowTools.push({ icon: toolIcon(info.name), label: toolLabel(info.name) });
          }
          addToolCall(bubble, info.id || '', info.name, info.arguments || '');

        } else if (event.code === 5) {
          let info;
          try { info = JSON.parse(event.content); } catch { info = { name: '?', result: event.content }; }
          if (info.name === 'todo_manager' || info.name === 'ask_user_question') continue;
          addToolResult(bubble, info.id || '', info.name, info.result || '');
          // Detect skill_manager save success -> toast + refresh
          if (info.name === 'skill_manager' && typeof info.result === 'string' && info.result.includes('已保存')) {
            const nameMatch = info.result.match(/技能\s*['"]?([^'"]+?)['"]?\s*已保存/);
            if (nameMatch) { showSkillToast(nameMatch[1]); loadSidebarSkills(); }
          }
        } else if (event.code === 6) {
          // Metrics line
          let m;
          try { m = JSON.parse(event.content); } catch { continue; }
          const footer = document.createElement('div');
          footer.className = 'metrics-line';
          const parts = [];
          if (m.total_ms) parts.push((m.total_ms / 1000).toFixed(1) + 's');
          if (m.steps) parts.push(m.steps + ' steps');
          if (m.tools && m.tools.length) parts.push(m.tools.join(', '));
          if (m.tokens) parts.push((m.tokens / 1000).toFixed(1) + 'k tokens');
          if (m.skill) parts.push(skillLabel(m.skill.name) + ' · ' + m.skill.type);
          footer.textContent = parts.join(' · ');
          bubble.parentElement.appendChild(footer);
        } else if (event.code === 7) {
          // Scheduled task event
          try {
            const data = JSON.parse(event.content);
            if (data.action === 'create' && data.task) {
              saveTask(data.task);
              showTaskToast('已创建定时任务: ' + data.task.name);
              loadSidebarTasks();
            } else if (data.action === 'delete' && data.task_id) {
              removeTask(data.task_id);
              showTaskToast('已删除定时任务');
              loadSidebarTasks();
            }
          } catch(e) { console.error('code 7 parse error:', e); }

        } else if (event.code === 8) {
          // HTML render: reference (preview_id + title, HTML stored in workspace storage)
          try {
            const r = JSON.parse(event.content);
            if (r.__html_render__ && r.preview_id) {
              const title = r.title || 'Preview';
              insertPreviewCard(bubble, r.preview_id, title, r.size_kb || 0);
              fetchAndOpenPreview(r.preview_id, title);
            }
          } catch(e) { console.error('code 8 parse error:', e); }

        } else if (event.code === 9) {
          // TODO progress panel
          try {
            const todoData = JSON.parse(event.content);
            if (todoData.tasks) {
              renderTodoPanel(bubble.parentElement, todoData.tasks);
            }
          } catch(e) { console.error('code 9 parse error:', e); }

        } else if (event.code === 10) {
          // Ask user option cards
          try {
            const askData = JSON.parse(event.content);
            if (askData.type === 'ask_user' && askData.options) {
              renderAskPanel(bubble.parentElement, askData.question || '', askData.options);
            }
          } catch(e) { console.error('code 10 parse error:', e); }
        }
      }
    }
  } catch (err) {
    const errDiv = document.createElement('div');
    errDiv.style.cssText = 'color:#ff3b30;margin-top:8px;font-size:0.82rem';
    errDiv.textContent = '请求失败: ' + err.message;
    bubble.appendChild(errDiv);
  }

  sending = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

// ========== Opportunity View ==========
function discoverOpportunity() {
  if (oppStreaming) return;
  showOpportunity();
  generateOpportunity();
}

async function generateOpportunity() {
  if (oppStreaming) return;
  if (oppAbortController) oppAbortController.abort();
  oppAbortController = new AbortController();

  oppStreaming = true;
  oppRegenBtn.disabled = true;

  const now = new Date();
  oppDateEl.textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

  oppArticleEl.innerHTML = '';
  oppLoadingEl.classList.remove('hidden');

  const userId = document.getElementById('userId').value || 'test';
  const oppSessionId = 'opp-' + now.toISOString().slice(0, 10);
  let rawText = '';

  try {
    const res = await fetch('/api/agent/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId: userId,
        sessionId: oppSessionId,
        requestId: Math.random().toString(36).slice(2, 10),
        data: { input: '根据我的用户画像，生成今日任务建议和工作提醒，不需要询问更多信息，直接输出。' },
      }),
      signal: oppAbortController.signal,
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let event;
        try { event = JSON.parse(line.slice(6)); } catch { continue; }

        if (event.code === 2) {
          rawText += event.content;
          oppLoadingEl.classList.add('hidden');
          oppArticleEl.innerHTML = renderMarkdown(rawText);
        } else if (event.code === 3) {
          if (event.content === 'stream_start') {
            oppLoadingEl.textContent = '分析中';
          } else if (event.content === 'stream_end') {
            if (!rawText) oppArticleEl.innerHTML = '<p style="color:var(--fg-muted)">暂无商机数据</p>';
            oppLoadingEl.classList.add('hidden');
            loadSessions();
          } else if (event.content.startsWith('error')) {
            oppLoadingEl.classList.add('hidden');
            oppArticleEl.innerHTML += '<p style="color:#ff3b30;font-size:0.82rem">' + event.content + '</p>';
          }
        }
        // Code 4/5 (tool calls/results): silently ignored
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      oppLoadingEl.classList.add('hidden');
      oppArticleEl.innerHTML = '<p style="color:#ff3b30;font-size:0.82rem">请求失败: ' + err.message + '</p>';
    }
  }

  oppStreaming = false;
  oppRegenBtn.disabled = false;
  oppAbortController = null;
}

function closeOpportunity() {
  if (oppAbortController) {
    oppAbortController.abort();
    oppAbortController = null;
    oppStreaming = false;
    oppRegenBtn.disabled = false;
  }
  if (previousView === 'chat') showChat();
  else showWelcome();
}

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, sessionId: sid }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6);

        if (event.code === 2) {
          rawText += event.content;
          bubble.innerHTML = renderMarkdown(rawText);
          scrollToBottom();
        } else if (event.code === 3) {
          if (event.content === 'stream_start') {
            bubble.textContent = '正在分析对话...';
          } else if (event.content === 'stream_end') {
            if (!rawText) {
              if (bubble.parentElement && bubble.parentElement.querySelector('.tool-tags')) {

              } else {

// ========== Image Upload ==========
let attachedImages = []; // [{ filename, url, localPreview }]
const imagePreviewBar = document.getElementById('imagePreviewBar');

async function uploadImageFiles(files) {
  // Switch to chat view if on welcome screen
  if (!welcomeEl.classList.contains('hidden')) showChat();
  const validFiles = [];
  for (const file of files) {
    if (!file.type.match(/^image\/(png|jpe?g|webp)$/)) {
      alert('仅支持 PNG/JPG/WEBP 图片: ' + file.name);
      continue;
    }
    validFiles.push(file);
  }
  if (!validFiles.length) return;

  const userId = document.getElementById('userId').value || 'test';
  const formData = new FormData();
  const localPreviews = [];

  for (const file of validFiles) {
    formData.append('files', file);
    localPreviews.push(URL.createObjectURL(file));
  }

  for (const preview of localPreviews) {
    addImagePreview(preview, null, true);
  }
  imagePreviewBar.classList.add('visible');

  try {
    const res = await fetch('/api/workspace/' + encodeURIComponent(userId) + '/images/upload', {
      method: 'POST',
      body: formData,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || '上传失败');
    }
    const data = await res.json();

    imagePreviewBar.innerHTML = '';
    for (const item of data.uploaded) {
      attachedImages.push({
        filename: item.filename,
        url: item.url,
        localPreview: null,
      });
    }
    renderImagePreviews();
  } catch (err) {
    alert('图片上传失败: ' + err.message);
    imagePreviewBar.innerHTML = '';
    renderImagePreviews();
  }
}

// File picker trigger
document.getElementById('imageInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  e.target.value = '';
  if (files.length) uploadImageFiles(files);
});

// Paste image from clipboard (Ctrl+V)
inputEl.addEventListener('paste', (e) => {
  const items = Array.from(e.clipboardData.items || []);
  const imageFiles = items
    .filter(item => item.kind === 'file' && item.type.match(/^image\//))
    .map(item => item.getAsFile())
    .filter(Boolean);
  if (imageFiles.length) {
    e.preventDefault();
    uploadImageFiles(imageFiles);
  }
});

// Drag & drop images onto input area
chatInputArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  chatInputArea.style.outline = '2px dashed var(--accent)';
  chatInputArea.style.outlineOffset = '-2px';
});
chatInputArea.addEventListener('dragleave', () => {
  chatInputArea.style.outline = '';
  chatInputArea.style.outlineOffset = '';
});
chatInputArea.addEventListener('drop', (e) => {
  e.preventDefault();
  chatInputArea.style.outline = '';
  chatInputArea.style.outlineOffset = '';
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.match(/^image\//));
  if (files.length) uploadImageFiles(files);
});

function addImagePreview(src, idx, uploading) {
  const item = document.createElement('div');
  item.className = 'image-preview-item' + (uploading ? ' image-uploading' : '');
  const img = document.createElement('img');
  img.src = src;
  item.appendChild(img);
  if (!uploading && idx !== null) {
    const btn = document.createElement('button');
    btn.className = 'image-remove';
    btn.textContent = '\u00d7';
    btn.onclick = () => removeImage(idx);
    item.appendChild(btn);
  }
  imagePreviewBar.appendChild(item);
}

function renderImagePreviews() {
  imagePreviewBar.innerHTML = '';
  attachedImages.forEach((img, idx) => {
    addImagePreview(img.url, idx, false);
  });
  if (attachedImages.length > 0) {
    imagePreviewBar.classList.add('visible');
  } else {
    imagePreviewBar.classList.remove('visible');
  }
}

function removeImage(idx) {
  attachedImages.splice(idx, 1);
  renderImagePreviews();
}

function clearImages() {
  attachedImages = [];
  imagePreviewBar.innerHTML = '';
  imagePreviewBar.classList.remove('visible');
}

const MAX_FILE_CHARS = 40000;

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';

  const name = file.name.toLowerCase();
  if (!name.endsWith('.md') && !name.endsWith('.txt') && !name.endsWith('.text') && !name.endsWith('.markdown')) {
    alert('仅支持 .md 和 .txt 文件');

  const reader = new FileReader();
  reader.onload = () => {

      alert('文件内容过长（' + content.length + ' 字符，上限 ' + MAX_FILE_CHARS + '），请缩减后重试。');
      return;

    attachedFile = { name: file.name, content: content };
    document.getElementById('fileTagName').textContent = file.name + ' (' + content.length + ' 字符)';
    document.getElementById('fileTag').classList.add('visible');
    inputEl.focus();
  };
  reader.onerror = () => {
    alert('读取文件失败');
  };

});

// ========== Sidebar Profile & Memory ==========
function toggleSidebarSection(id) {
  const section = document.getElementById(id);
  if (!section) return;
  const isOpen = section.classList.toggle('open');
  const body = section.querySelector('.sidebar-section-body');
  if (isOpen) { body.classList.remove('hidden'); } else { body.classList.add('hidden'); }
}

function parseUserProfile(content) {
  const fields = [];
  const lines = content.split('\n');
  let inFrontmatter = false;
  for (const line of lines) {
    if (line.trim() === '---') { inFrontmatter = !inFrontmatter; continue; }
    if (inFrontmatter) continue;
    if (line.startsWith('## ')) continue;
    if (/^（.*）$/.test(line.trim())) continue;
    const m = line.match(/^(.+?)：(.*)$/);
    if (m) {
      fields.push({ name: m[1].trim(), value: m[2].trim() });
    }
  }
  return fields;
}

function renderProfileTable(fields) {
  const el = document.getElementById('profileTable');
  if (!fields || fields.length === 0) {
    el.innerHTML = '<div class="sidebar-section-empty">暂无画像信息</div>';
    return;
  }
  const table = document.createElement('table');
  table.className = 'profile-table';
  for (const f of fields) {
    const tr = document.createElement('tr');
    const tdName = document.createElement('td');
    tdName.className = 'field-name';
    tdName.textContent = f.name;
    tr.appendChild(tdName);
    const tdVal = document.createElement('td');
    if (f.value) {
      tdVal.className = 'field-value';
      tdVal.textContent = f.value;
    } else {
      tdVal.className = 'field-empty';
      tdVal.textContent = '未填写';
    }
    tr.appendChild(tdVal);
    table.appendChild(tr);
  }
  el.textContent = '';
  el.appendChild(table);
}

function renderMemory(content) {
  const el = document.getElementById('memoryContent');
  // Strip YAML frontmatter
  let body = content;
  if (body.startsWith('---')) {
    const end = body.indexOf('---', 3);
    if (end !== -1) body = body.slice(end + 3).trim();
  }
  if (!body) {
    el.innerHTML = '<div class="sidebar-section-empty">暂无记忆</div>';
    return;
  }
  const div = document.createElement('div');
  div.className = 'memory-rendered';
  div.innerHTML = DOMPurify.sanitize(marked.parse(body));
  el.textContent = '';
  el.appendChild(div);
}

async function loadSidebarFiles() {
  const userId = document.getElementById('userId').value;
  if (!userId) return;
  try {
    const [userRes, memRes] = await Promise.all([
      fetch('/api/workspace/' + encodeURIComponent(userId) + '/files/prompts/USER.md'),
      fetch('/api/workspace/' + encodeURIComponent(userId) + '/files/prompts/MEMORY.md')
    ]);
    if (userRes.ok) {
      const userData = await userRes.json();
      renderProfileTable(parseUserProfile(userData.content || ''));
    }
    if (memRes.ok) {
      const memData = await memRes.json();
      renderMemory(memData.content || '');
    }
  } catch(e) { /* silent */ }
  loadSidebarSkills();
  loadSidebarSubAgents();
}

// ========== Sidebar Sub-agents ==========
async function loadSidebarSubAgents() {
  try {
    const res = await fetch('/api/sub-agent/types');
    if (!res.ok) return;
    const data = await res.json();
    const el = document.getElementById('subAgentsContent');
    const countEl = document.getElementById('subAgentCount');
    if (countEl) countEl.textContent = data.count || 0;
    if (!data.types || !data.types.length) {
      el.innerHTML = '<div class="sidebar-section-empty">暂无子 agent<br><span style="font-size:0.75rem;color:var(--fg-muted)">在 configs/agents/ 添加 .md 配置</span></div>';
      return;
    }
    el.innerHTML = data.types.map(t => {
      const skillsLine = (t.skills && t.skills.length)
        ? '<div class="skill-card-meta"><span>技能: ' + t.skills.slice(0, 3).join(', ') + '</span></div>'

function parseSkillProposal(text) {
  const get = (key) => {
    const m = text.match(new RegExp('^' + key + ':\\s*(.+)$', 'm'));
    return m ? m[1].trim() : '';
  };
  const instrMatch = text.match(/instructions:\s*\|?\n([\s\S]*?)$/);
  return {
    name: get('name'),
    description: get('description'),
    triggers: get('triggers').split(',').map(s => s.trim()).filter(Boolean),
    required_tools: get('required_tools').split(',').map(s => s.trim()).filter(Boolean),
    instructions: instrMatch ? instrMatch[1].trim() : '',
  };
}

// ========== Scheduled Tasks ==========

const TASK_STORAGE_KEY = () => 'evoagent_tasks_' + (document.getElementById('userId').value || 'test');

function getTasks() {
  try { return JSON.parse(localStorage.getItem(TASK_STORAGE_KEY()) || '[]'); }
  catch { return []; }
}

function saveTasks(tasks) {
  localStorage.setItem(TASK_STORAGE_KEY(), JSON.stringify(tasks));
}

function saveTask(task) {
  const tasks = getTasks();
  const idx = tasks.findIndex(t => t.id === task.id);
  if (idx >= 0) tasks[idx] = task; else tasks.push(task);
  saveTasks(tasks);
}

function removeTask(taskId) {
  saveTasks(getTasks().filter(t => t.id !== taskId));
}

function showTaskToast(msg) {
  const t = document.createElement('div');
  t.className = 'task-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function loadSidebarTasks() {
  const tasks = getTasks();
  const countEl = document.getElementById('taskCount');
  const el = document.getElementById('tasksContent');
  if (countEl) countEl.textContent = tasks.length;
  if (!el) return;

  if (!tasks.length) {
    el.innerHTML = '<div class="sidebar-section-empty">暂无定时任务</div>' +
      '<button class="task-add-btn" onclick="showTaskForm()">+ 新建任务</button>';
    return;
  }

  const repeatLabels = { daily: '每天', weekly: '每周', once: '仅一次' };
  el.innerHTML = tasks.map(t => {
    const time = String(t.hour).padStart(2, '0') + ':' + String(t.minute).padStart(2, '0');
    const repeat = repeatLabels[t.repeat] || t.repeat;
    return '<div class="task-card" data-task-id="' + t.id + '">' +
      '<div class="task-card-info">' +
        '<div class="task-card-name">' + t.name + '</div>' +
        '<div class="task-card-time">' + repeat + ' ' + time + '</div>' +
        (t.skill ? '<div class="task-card-skill">' + t.skill + '</div>' : '') +
      '</div>' +
      '<button class="task-toggle ' + (t.enabled ? 'on' : '') + '" onclick="toggleTask(\'' + t.id + '\')"></button>' +
      '<button class="task-del-btn" onclick="deleteTask(\'' + t.id + '\')" title="删除">✕</button>' +
    '</div>';
  }).join('') +
  '<button class="task-add-btn" onclick="showTaskForm()">+ 新建任务</button>';
}

function toggleTask(taskId) {
  const tasks = getTasks();

function createTaskFromForm() {

    hour: h,
    minute: m,

// Task scheduler — check every 30 seconds
let _taskTimerId = null;
function startTaskScheduler() {
  if (_taskTimerId) return;
  setTimeout(checkScheduledTasks, 3000);
  _taskTimerId = setInterval(checkScheduledTasks, 30000);
}

function checkScheduledTasks() {
  const tasks = getTasks();
  if (!tasks.length) return;
  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  const weekday = now.getDay();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  let changed = false;

  for (const task of tasks) {
    if (!task.enabled) continue;
    if (task.lastRun === today) continue;
    if (task.repeat === 'weekly' && weekday !== 1) continue;
    const taskMinutes = (task.hour || 0) * 60 + (task.minute || 0);
    if (nowMinutes >= taskMinutes) {
      task.lastRun = today;
      changed = true;
      console.log('[Scheduler] Triggering task:', task.name);
      executeScheduledTask(task);
      if (task.repeat === 'once') { task.enabled = false; }
    }
  }
  if (changed) { saveTasks(tasks); loadSidebarTasks(); }
}

async function executeScheduledTask(task) {
  const userId = document.getElementById('userId').value;
  if (!userId) return;
  const sessionId = 'sched_' + task.id + '_' + new Date().toISOString().slice(0, 10);
  try {
    const res = await fetch('/api/agent/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, sessionId, data: { input: task.prompt } }),
    });
    const reader = res.body.getReader();
    while (true) { const { done } = await reader.read(); if (done) break; }
    notifyTaskComplete(task.name);
    loadSessions();
  } catch (e) {
    console.error('[Scheduler] Task failed:', task.name, e);
  }
}

function createSessionCard(session) {
  const card = document.createElement('div');
  card.className = 'session-card';
  if (session.session_id === sessionEl.value) {

  }
  card.dataset.sid = session.session_id;

  } else if (session.session_id && session.session_id.startsWith('sched_')) {

  }

  const preview = document.createElement('div');
  preview.className = 'session-preview';
  if (session.session_id && session.session_id.startsWith('opp-')) {
    const tag = document.createElement('span');
    tag.className = 'session-tag';
    tag.textContent = '商机';
    preview.appendChild(tag);
  } else if (session.session_id && session.session_id.startsWith('sched_')) {
    const tag = document.createElement('span');
    tag.className = 'session-tag';
    tag.style.cssText = 'background:#dcfce7;color:#16a34a';
    tag.textContent = '定时';
    preview.appendChild(tag);

  preview.appendChild(document.createTextNode(session.preview || '新对话'));

  meta.className = 'session-meta';

  const idSpan = document.createElement('span');
  idSpan.className = 'session-id';
  const sid = session.session_id || '';
  if (sid.startsWith('sched_')) {
    const dateMatch = sid.match(/(\d{4}-\d{2}-\d{2})$/);
    idSpan.textContent = dateMatch ? 'sched_' + dateMatch[1].slice(5) : sid.slice(0, 16);
  } else {
    idSpan.textContent = sid;
  }
  meta.appendChild(idSpan);

  if (session.timestamp) {
    const timeSpan = document.createElement('span');
    const d = new Date(session.timestamp);
    timeSpan.textContent = d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    meta.appendChild(timeSpan);
  }

  const countSpan = document.createElement('span');
  countSpan.textContent = (session.message_count || 0) + ' 条消息';
  meta.appendChild(countSpan);

  card.appendChild(meta);
  return card;
}

async function restoreSession(sid) {
  const userId = document.getElementById('userId').value || 'test';
  try {
    const res = await fetch('/api/workspace/' + encodeURIComponent(userId) + '/sessions/' + encodeURIComponent(sid));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // Update session ID
    sessionEl.value = sid;
    syncBridgeState(userId, sid);

    // Switch to chat view
    showChat();

    // Clear chat
    chatEl.textContent = '';

    // Render conversation (no animation for restored messages)
    const conv = data.conversation || [];
    let lastBotBubble = null;
    conv.forEach(msg => {
      if (msg._hidden || (msg.role === 'user' && msg.content && msg.content.startsWith('[auto-skill-extract]'))) return;
      if (msg.role === 'user') {
        const div = document.createElement('div');
        div.className = 'msg user restored';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = msg.content;
        div.appendChild(bubble);
        chatEl.appendChild(div);
        lastBotBubble = null;
      } else if (msg.role === 'assistant') {
        // Create bot msg div for tool_calls or text content
        if (msg.tool_calls && msg.tool_calls.length) {
          // Ensure a bot bubble exists for tool tags
          if (!lastBotBubble) {
            const div = document.createElement('div');
            div.className = 'msg bot restored';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            div.appendChild(bubble);
            chatEl.appendChild(div);
            lastBotBubble = bubble;
          }
          msg.tool_calls.forEach(tc => {
            const tcId = tc.id || '';
            const name = tc.function ? tc.function.name : '?';
            if (name === 'todo_manager' || name === 'ask_user_question') return;
            const args = tc.function ? (typeof tc.function.arguments === 'string' ? tc.function.arguments : JSON.stringify(tc.function.arguments || {})) : '';
            addToolCall(lastBotBubble, tcId, name, args);
          });
        }
        if (msg.content && msg.content.trim()) {
          if (!lastBotBubble) {
            const div = document.createElement('div');
            div.className = 'msg bot restored';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            div.appendChild(bubble);
            chatEl.appendChild(div);
            lastBotBubble = bubble;
          }
          lastBotBubble.innerHTML = renderMarkdown(msg.content);
        }
      } else if (msg.role === 'tool') {
        if (lastBotBubble) {
          const name = msg.name || '?';
          const content = msg.content || '';
          // todo_manager → 恢复心流面板（只保留最后一次快照）
          if (name === 'todo_manager') {
            try {
              var td = JSON.parse(content);
              if (td.tasks) {
                renderTodoPanel(lastBotBubble.parentElement, td.tasks);
              }
            } catch(e) {}
          } else if (name === 'ask_user_question') {
            try {
              var askd = JSON.parse(content);
              if (askd.type === 'ask_user' && askd.options) {
                renderAskPanel(lastBotBubble.parentElement, askd.question || '', askd.options);
              }
            } catch(e) {}
          } else {
            addToolResult(lastBotBubble, msg.tool_call_id || '', name, content);
            // Rebuild html_render preview cards from history
            if (name === 'html_render' && content) {
              try {
                const r = JSON.parse(content);
                if (r.__html_render__ && r.preview_id) {
                  insertPreviewCard(lastBotBubble, r.preview_id, r.title || 'Preview', r.size_kb || 0);
                }
              } catch {}
            }
          }
        }
      }
    });
    scrollToBottom();

    // Update active state on session cards
    document.querySelectorAll('.session-card').forEach(c => {
      c.classList.toggle('active', c.dataset.sid === sid);
    });
  } catch (err) {
    alert('恢复会话失败: ' + err.message);
  }
}

function getSkillMaturity(skill) {
  const u = skill.usage_count || 0;
  const sr = skill.success_rate != null ? skill.success_rate : 1.0;
  // Warm palette: terracotta / sage / coral / stone
  if (u >= 10 && sr >= 0.85) return { stage: 4, name: '精通', color: '#c96442', pct: 100 };
  if (u >= 4 && sr >= 0.7)   return { stage: 3, name: '成熟', color: '#7a8a6f', pct: 70 };
  if (u >= 1)                return { stage: 2, name: '成长', color: '#d97757', pct: 40 };
  return { stage: 1, name: '萌芽', color: '#87867f', pct: 10 };
}

function getSourceInfo(skill) {
  if (skill.source === 'extracted') return { icon: '', label: '学习', cls: 'gp-source-extracted' };
  if (skill.source === 'user_defined') return { icon: '', label: '自定义', cls: 'gp-source-user' };
  return { icon: '', label: '内置', cls: 'gp-source-builtin' };
}

function buildTimeline(skills) {
  const events = [];
  for (const s of skills) {
    const src = getSourceInfo(s);
    if (s.created_at) {
      const actionMap = { builtin: '被激活', extracted: '从对话中学习', user_defined: '由用户创建' };
      events.push({ date: s.created_at.slice(0, 10), icon: src.icon, text: s.name + ' ' + (actionMap[s.source] || '被添加') });
    }
    if (s.updated_at && s.created_at && s.updated_at.slice(0, 10) !== s.created_at.slice(0, 10)) {
      events.push({ date: s.updated_at.slice(0, 10), icon: '\u2192', text: s.name + ' 更新至 v' + (s.version || 1) });
    }
  }
  events.sort((a, b) => b.date.localeCompare(a.date));
  const grouped = {};
  for (const e of events) {
    if (!grouped[e.date]) grouped[e.date] = [];
    grouped[e.date].push(e);
  }
  return grouped;
}

function renderSkillEvolution(skills) {
  const body = document.getElementById('growthBody');

  if (!skills.length) {
    body.innerHTML = '<div class="gp-empty">暂无技能<br><span style="font-size:0.75rem;color:var(--fg-muted)">与 EvoAgent 对话后，技能会自动生成</span></div>';
    return;
  }

  const builtinCount = skills.filter(s => s.source === 'builtin' || s.is_builtin).length;
  const extractedCount = skills.filter(s => s.source === 'extracted').length;
  const userCount = skills.filter(s => s.source === 'user_defined').length;
  const totalUsage = skills.reduce((sum, s) => sum + (s.usage_count || 0), 0);
  const avgSuccess = skills.length ? Math.round(skills.reduce((sum, s) => sum + ((s.success_rate != null ? s.success_rate : 1) * 100), 0) / skills.length) : 0;
  const activatedCount = skills.filter(s => (s.usage_count || 0) > 0).length;

  let html = '';

  // A. Overview card
  const dots = skills.map((_, i) => i < activatedCount ? '\u25CF' : '\u25CB').join(' ');
  html += '<div class="gp-overview">' +
    '<div class="gp-overview-top">' +
      '<img class="gp-overview-icon" src="/static/resources/brain_circuit.svg" width="28" height="28">' +
      '<span class="gp-overview-title">EvoAgent 技能图谱</span>' +
    '</div>' +
    '<div class="gp-overview-dots">' + dots + ' <span style="font-size:0.72rem;opacity:0.7">' + activatedCount + '/' + skills.length + ' 已激活</span></div>' +
    '<div class="gp-overview-stats">' +
      '<span class="gp-stat-chip">内置 ' + builtinCount + '</span>' +
      '<span class="gp-stat-chip">学习 ' + extractedCount + '</span>' +
      '<span class="gp-stat-chip">自定义 ' + userCount + '</span>' +
    '</div>' +
    '<div class="gp-overview-row"><span>总调用 ' + totalUsage + ' 次</span><span>平均成功率 ' + avgSuccess + '%</span></div>' +
  '</div>';

  // B. Skill evolution cards
  const stages = ['\u25CB', '\u25D1', '\u25D0', '\u25CF'];
  skills.sort((a, b) => (b.usage_count || 0) - (a.usage_count || 0));
  for (const s of skills) {
    const m = getSkillMaturity(s);
    const src = getSourceInfo(s);
    const stageIcons = stages.map((icon, i) => '<span class="' + (i < m.stage ? 'active' : 'inactive') + '">' + icon + '</span>').join(' \u2192 ');
    const tools = (s.required_tools || []).map(t => '<span class="gp-tool-tag">' + t + '</span>').join('');
    const updated = s.updated_at ? s.updated_at.slice(0, 10) : '';

    html += '<div class="gp-skill-card">' +
      '<div class="gp-skill-head">' +
        '<span class="gp-skill-name">' + skillLabel(s.name) + '</span>' +
        '<span class="gp-skill-ver">v' + (s.version || 1) + '</span>' +
        '<span class="gp-source-tag ' + src.cls + '">' + src.icon + ' ' + src.label + '</span>' +
      '</div>' +
      '<div class="gp-skill-desc">' + (s.description || '') + '</div>' +
      '<div class="gp-maturity-icons">' + stageIcons + '</div>' +
      '<div class="gp-maturity-bar"><div class="gp-maturity-fill" style="width:' + m.pct + '%;background:' + m.color + '"></div></div>' +
      '<div class="gp-maturity-label" style="color:' + m.color + '">' + m.name + '</div>' +
      '<div class="gp-skill-metrics">' +
        '<span>调用 ' + (s.usage_count || 0) + ' 次</span>' +
        '<span>成功率 ' + Math.round((s.success_rate != null ? s.success_rate : 1) * 100) + '%</span>' +
        (updated ? '<span>更新 ' + updated + '</span>' : '') +
      '</div>' +
      (tools ? '<div class="gp-tool-tags">' + tools + '</div>' : '') +
    '</div>';
  }

  // C. Timeline
  const timeline = buildTimeline(skills);
  const dates = Object.keys(timeline);
  if (dates.length) {
    html += '<div class="gp-skill-card" style="padding-bottom:8px">' +
      '<div class="gp-timeline-title">技能时间线</div>' +
      '<div class="gp-timeline">';
    for (const date of dates) {
      html += '<div class="gp-timeline-group">' +
        '<div class="gp-timeline-date">' + date + '</div>';
      for (const ev of timeline[date]) {
        html += '<div class="gp-timeline-event">' + ev.icon + ' ' + ev.text + '</div>';
      }
      html += '</div>';
    }
    html += '</div></div>';
  }

  body.innerHTML = html;
}

// Auth password field: Enter key submits
document.getElementById('authPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') authSubmit();
});
document.getElementById('authUsername').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('authPassword').focus();
});

function bridgeCleanupBeacon() {
  if (!bridgeBootstrap || !bridgeBootstrap.bridge) return;
  try {
    navigator.sendBeacon('/api/bridge/cleanup', new Blob(['{}'], { type: 'application/json' }));
  } catch (e) {}
}

window.addEventListener('pagehide', bridgeCleanupBeacon);
window.addEventListener('beforeunload', bridgeCleanupBeacon);

// Check auth on page load (must be AFTER all const declarations)
(async function checkAuth() {
  try {
    const bridgeRes = await fetch('/api/bridge/bootstrap');
    if (bridgeRes.ok) {
      bridgeBootstrap = await bridgeRes.json();
      if (bridgeBootstrap && bridgeBootstrap.bridge && bridgeBootstrap.username) {
        await enterApp(bridgeBootstrap.username);
        return;
      }
    }
  } catch (e) {}

  const saved = localStorage.getItem('evoagent_user');
  if (saved) {
    enterApp(saved);
  }
})();
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="req2" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7f"/>
    </marker>
    <marker id="resp2" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e8a5a"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a365d">
    Offline Evolution Loop
  </text>

  <!-- Row 1: two ways to start a review -->
  <rect x="40" y="55" width="290" height="70" rx="10" fill="#f0f4fa" stroke="#4a6ea9" stroke-width="1.5"/>
  <text x="185" y="80" text-anchor="middle" font-weight="bold" fill="#1a365d">"Update memory" button</text>
  <text x="185" y="100" text-anchor="middle" fill="#5a6b7f" font-size="11">Web UI</text>
  <text x="185" y="116" text-anchor="middle" fill="#5a6b7f" font-size="11">POST /api/agent/update-session</text>

  <rect x="670" y="55" width="290" height="70" rx="10" fill="#f0f4fa" stroke="#4a6ea9" stroke-width="1.5"/>
  <text x="815" y="80" text-anchor="middle" font-weight="bold" fill="#1a365d">Ask in the conversation</text>
  <text x="815" y="100" text-anchor="middle" fill="#5a6b7f" font-size="11">"review this session", "extract skills"</text>
  <text x="815" y="116" text-anchor="middle" fill="#5a6b7f" font-size="11">main agent calls sub_agent</text>

  <text x="500" y="92" text-anchor="middle" fill="#5a6b7f" font-size="12">on demand only:</text>
  <text x="500" y="108" text-anchor="middle" fill="#5a6b7f" font-size="12">no automatic review after a turn</text>

  <!-- Row 2: the reviewer (an LLM run with its own prompt and tools) -->
  <rect x="40" y="165" width="290" height="72" rx="10" fill="#dbe5f5" stroke="#2b5daf" stroke-width="2"/>
  <text x="185" y="190" text-anchor="middle" font-weight="bold" fill="#1a365d">SessionUpdater</text>
  <text x="185" y="210" text-anchor="middle" fill="#3a5b8a" font-size="11">run_session_update_stream (core/agent.py)</text>
  <text x="185" y="226" text-anchor="middle" fill="#3a5b8a" font-size="11">reads history · profile · recent sessions</text>

  <rect x="670" y="165" width="290" height="72" rx="10" fill="#dbe5f5" stroke="#2b5daf" stroke-width="2"/>
  <text x="815" y="190" text-anchor="middle" font-weight="bold" fill="#1a365d">session-reviewer (sub-agent)</text>
  <text x="815" y="210" text-anchor="middle" fill="#3a5b8a" font-size="11">configs/agents/session-reviewer.md</text>
  <text x="815" y="226" text-anchor="middle" fill="#3a5b8a" font-size="11">reads the parent history on demand</text>

  <text x="500" y="196" text-anchor="middle" fill="#3a5b8a" font-size="12">both follow the extraction rules in</text>
  <text x="500" y="213" text-anchor="middle" fill="#3a5b8a" font-size="12" font-weight="bold">SKILL_EXTRACT.md</text>

  <line x1="185" y1="125" x2="185" y2="162" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req2)"/>
  <line x1="815" y1="125" x2="815" y2="162" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req2)"/>

  <!-- Bus from the reviewers to the three tool groups -->
  <line x1="185" y1="237" x2="185" y2="262" stroke="#5a6b7f" stroke-width="1.5"/>
  <line x1="815" y1="237" x2="815" y2="262" stroke="#5a6b7f" stroke-width="1.5"/>
  <line x1="185" y1="262" x2="815" y2="262" stroke="#5a6b7f" stroke-width="1.5"/>
  <line x1="185" y1="262" x2="185" y2="292" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req2)"/>
  <line x1="500" y1="262" x2="500" y2="292" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req2)"/>
  <line x1="815" y1="262" x2="815" y2="292" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req2)"/>
  <text x="500" y="256" text-anchor="middle" fill="#5a6b7f" font-size="11">tool calls</text>

  <!-- Row 3: what the reviewer can do -->
  <rect x="40" y="295" width="290" height="96" rx="10" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/>
  <text x="185" y="320" text-anchor="middle" font-weight="bold" fill="#7a5c00">User profile</text>
  <text x="185" y="340" text-anchor="middle" fill="#7a5c00" font-size="11">update_user_profile tool</text>
  <text x="185" y="357" text-anchor="middle" fill="#7a5c00" font-size="11">explicit facts about the user only</text>
  <text x="185" y="374" text-anchor="middle" fill="#7a5c00" font-size="11">written directly</text>

  <rect x="355" y="295" width="290" height="96" rx="10" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/>
  <text x="500" y="320" text-anchor="middle" font-weight="bold" fill="#7a5c00">Long-term memory</text>
  <text x="500" y="340" text-anchor="middle" fill="#7a5c00" font-size="11">memory tool</text>
  <text x="500" y="357" text-anchor="middle" fill="#7a5c00" font-size="11">user · feedback · project · reference</text>
  <text x="500" y="374" text-anchor="middle" fill="#7a5c00" font-size="11">written directly</text>

  <rect x="670" y="295" width="290" height="96" rx="10" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="815" y="320" text-anchor="middle" font-weight="bold" fill="#7a5c00">Skill proposals</text>
  <text x="815" y="340" text-anchor="middle" fill="#7a5c00" font-size="11">skill: list → get / get_ref → propose</text>
  <text x="815" y="357" text-anchor="middle" fill="#7a5c00" font-size="11">create · update · patch</text>
  <text x="815" y="374" text-anchor="middle" fill="#7a5c00" font-size="11" font-weight="bold">staged only: no skill is written yet</text>

  <!-- Row 4: user confirmation gate -->
  <line x1="815" y1="391" x2="815" y2="432" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req2)"/>
  <text x="805" y="407" text-anchor="end" fill="#5a6b7f" font-size="11">stage: .meta/proposals/&lt;id&gt;.json</text>
  <text x="805" y="423" text-anchor="end" fill="#5a6b7f" font-size="11">SSE code 12: full proposal</text>

  <rect x="670" y="435" width="290" height="88" rx="10" fill="#e6f4ec" stroke="#1e8a5a" stroke-width="2"/>
  <text x="815" y="460" text-anchor="middle" font-weight="bold" fill="#14583a">User confirms or rejects</text>
  <text x="815" y="480" text-anchor="middle" fill="#14583a" font-size="11">proposal card lists every file to be written</text>
  <text x="815" y="497" text-anchor="middle" fill="#14583a" font-size="11">Confirm: POST /api/skills/…/proposals/&lt;id&gt;/confirm</text>
  <text x="815" y="514" text-anchor="middle" fill="#14583a" font-size="11">Reject: DELETE …/proposals/&lt;id&gt;</text>

  <!-- Row 5: validation depends on the proposed operation -->
  <line x1="815" y1="523" x2="815" y2="551" stroke="#1e8a5a" stroke-width="1.5" marker-end="url(#resp2)"/>
  <rect x="670" y="554" width="290" height="114" rx="10" fill="#e6f4ec" stroke="#1e8a5a" stroke-width="1.5"/>
  <text x="815" y="578" text-anchor="middle" font-weight="bold" fill="#14583a">Checks at confirmation</text>
  <text x="815" y="598" text-anchor="middle" fill="#14583a" font-size="11">create: name available</text>
  <text x="815" y="615" text-anchor="middle" fill="#14583a" font-size="11">update: base content matches</text>
  <text x="815" y="632" text-anchor="middle" fill="#14583a" font-size="11">patch: unique match + conditional write</text>
  <text x="815" y="650" text-anchor="middle" fill="#14583a" font-size="11">Conflict: 409; read again and re-propose</text>

  <!-- Row 6: persistence -->
  <rect x="60" y="710" width="880" height="56" rx="10" fill="#ede8f5" stroke="#5a4a9e" stroke-width="1.5"/>
  <text x="500" y="733" text-anchor="middle" font-weight="bold" fill="#3b2f73">Workspace (per-user)</text>
  <text x="500" y="752" text-anchor="middle" fill="#5a4a9e" font-size="11">prompts/USER.md · prompts/MEMORY*.md · skills/&lt;skill&gt;/ · .meta/skill_prev/ (undo for replaced skills)</text>

  <line x1="185" y1="391" x2="185" y2="707" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req2)"/>
  <text x="195" y="485" fill="#5a6b7f" font-size="11">write</text>
  <line x1="500" y1="391" x2="500" y2="707" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req2)"/>
  <text x="510" y="485" fill="#5a6b7f" font-size="11">write</text>
  <line x1="815" y1="668" x2="815" y2="707" stroke="#1e8a5a" stroke-width="1.5" marker-end="url(#resp2)"/>
  <text x="805" y="692" text-anchor="end" fill="#1e8a5a" font-size="11">SkillManager applies the change</text>

  <!-- Loop-back to the online loop -->
  <path d="M 60 738 C 20 738, 18 330, 18 120" fill="none" stroke="#1e8a5a" stroke-width="1.5"
        stroke-dasharray="5 3" marker-end="url(#resp2)"/>
  <text transform="translate(12, 470) rotate(-90)" text-anchor="middle" fill="#1e8a5a" font-size="11">loaded on the next online turn</text>

  <!-- Legend -->
  <g transform="translate(40, 780)">
    <rect x="0"   y="0" width="13" height="13" fill="#f0f4fa" stroke="#4a6ea9"/>
    <text x="19"  y="11" font-size="11" fill="#333">Trigger</text>
    <rect x="80"  y="0" width="13" height="13" fill="#dbe5f5" stroke="#2b5daf"/>
    <text x="99" y="11" font-size="11" fill="#333">Reviewer</text>
    <rect x="170" y="0" width="13" height="13" fill="#fdf6e3" stroke="#b58900"/>
    <text x="189" y="11" font-size="11" fill="#333">Updater</text>
    <rect x="250" y="0" width="13" height="13" fill="#e6f4ec" stroke="#1e8a5a"/>
    <text x="269" y="11" font-size="11" fill="#333">User gate</text>
    <rect x="340" y="0" width="13" height="13" fill="#ede8f5" stroke="#5a4a9e"/>
    <text x="359" y="11" font-size="11" fill="#333">Persistence</text>

    <line x1="450" y1="6" x2="480" y2="6" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req2)"/>
    <text x="485" y="11" font-size="11" fill="#333">request / write</text>
    <line x1="590" y1="6" x2="620" y2="6" stroke="#1e8a5a" stroke-width="1.5" marker-end="url(#resp2)"/>
    <text x="625" y="11" font-size="11" fill="#333">after user confirmation</text>
    <line x1="760" y1="6" x2="790" y2="6" stroke="#1e8a5a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#resp2)"/>
    <text x="795" y="11" font-size="11" fill="#333">loop-back to next turn</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="req-end" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7f"/>
    </marker>
    <marker id="resp-end" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e8a5a"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a365d">
    Online Execution Loop
  </text>

  <!-- Row 1: client entry chain -->
  <rect x="40"  y="60" width="110" height="42" rx="8" fill="#f0f4fa" stroke="#4a6ea9" stroke-width="1.5"/>
  <text x="95"  y="86" text-anchor="middle" fill="#1a365d">User</text>

  <rect x="200" y="60" width="150" height="42" rx="8" fill="#f0f4fa" stroke="#4a6ea9" stroke-width="1.5"/>
  <text x="275" y="86" text-anchor="middle" fill="#1a365d">Web UI / CLI</text>

  <rect x="400" y="60" width="170" height="42" rx="8" fill="#f0f4fa" stroke="#4a6ea9" stroke-width="1.5"/>
  <text x="485" y="80" text-anchor="middle" fill="#1a365d">FastAPI</text>
  <text x="485" y="96" text-anchor="middle" fill="#5a6b7f" font-size="11">app/api/server.py</text>

  <!-- User ↔ UI (request + response) -->
  <line x1="150" y1="74" x2="197" y2="74" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)"/>
  <text x="173" y="68" text-anchor="middle" fill="#5a6b7f" font-size="10">prompt</text>
  <line x1="200" y1="92" x2="153" y2="92" stroke="#1e8a5a" stroke-width="1.5" marker-end="url(#resp-end)"/>
  <text x="173" y="116" text-anchor="middle" fill="#1e8a5a" font-size="10">rendered tokens</text>

  <!-- UI ↔ API (request + response) -->
  <line x1="350" y1="74" x2="397" y2="74" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)"/>
  <text x="373" y="68" text-anchor="middle" fill="#5a6b7f" font-size="10">POST /chat</text>
  <line x1="400" y1="92" x2="353" y2="92" stroke="#1e8a5a" stroke-width="1.5" marker-end="url(#resp-end)"/>
  <text x="373" y="116" text-anchor="middle" fill="#1e8a5a" font-size="10">SSE stream</text>

  <!-- Row 2: Orchestrator + Skill matcher -->
  <rect x="280" y="170" width="260" height="80" rx="10" fill="#dbe5f5" stroke="#2b5daf" stroke-width="2"/>
  <text x="410" y="196" text-anchor="middle" font-weight="bold" fill="#1a365d">EvoAgent Orchestrator</text>
  <text x="410" y="216" text-anchor="middle" fill="#3a5b8a" font-size="11">core/agent.py</text>
  <text x="410" y="234" text-anchor="middle" fill="#3a5b8a" font-size="11">ReAct · budget · handoff</text>

  <rect x="600" y="170" width="230" height="80" rx="10" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/>
  <text x="715" y="196" text-anchor="middle" font-weight="bold" fill="#7a5900">3-Stage Skill Matcher</text>
  <text x="715" y="216" text-anchor="middle" fill="#7a5900" font-size="11">keyword → embedding → LLM</text>
  <text x="715" y="234" text-anchor="middle" fill="#7a5900" font-size="11">core/skills/</text>

  <!-- API ↔ Orchestrator (request + response) -->
  <line x1="470" y1="102" x2="400" y2="170" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)"/>
  <text x="410" y="135" fill="#5a6b7f" font-size="10">invoke</text>
  <line x1="440" y1="170" x2="510" y2="102" stroke="#1e8a5a" stroke-width="1.5" marker-end="url(#resp-end)"/>
  <text x="504" y="144" fill="#1e8a5a" font-size="10">emit events</text>

  <!-- Orchestrator ↔ Skill matcher -->
  <line x1="540" y1="198" x2="600" y2="198" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)"/>
  <text x="570" y="190" text-anchor="middle" fill="#5a6b7f" font-size="10">query</text>
  <line x1="600" y1="222" x2="540" y2="222" stroke="#5a6b7f" stroke-width="1.5"
        marker-end="url(#req-end)" stroke-dasharray="5 3"/>
  <text x="570" y="238" text-anchor="middle" fill="#5a6b7f" font-size="10">inject SKILL.md</text>

  <!-- Row 3: SDK / Tools / Sub / Compressor -->
  <rect x="40"  y="310" width="230" height="80" rx="10" fill="#e6f3ea" stroke="#3a8e5a" stroke-width="1.5"/>
  <text x="155" y="336" text-anchor="middle" font-weight="bold" fill="#1e5d36">OpenAI Agents SDK</text>
  <text x="155" y="356" text-anchor="middle" fill="#3a6b4f" font-size="11">Runner.run_streamed</text>
  <text x="155" y="374" text-anchor="middle" fill="#3a6b4f" font-size="11">core/agent_compat.py</text>

  <rect x="310" y="310" width="230" height="80" rx="10" fill="#e6f3ea" stroke="#3a8e5a" stroke-width="1.5"/>
  <text x="425" y="336" text-anchor="middle" font-weight="bold" fill="#1e5d36">Tools (plugins + internal)</text>
  <text x="425" y="356" text-anchor="middle" fill="#3a6b4f" font-size="11">core/plugins/</text>
  <text x="425" y="374" text-anchor="middle" fill="#3a6b4f" font-size="11">execute_code · fetch_url · memory · skills</text>

  <rect x="580" y="310" width="180" height="80" rx="10" fill="#fcecef" stroke="#ae3e5a" stroke-width="1.5"/>
  <text x="670" y="336" text-anchor="middle" font-weight="bold" fill="#7a2a3f">Sub-Agent Runner</text>
  <text x="670" y="356" text-anchor="middle" fill="#7a2a3f" font-size="11">core/sub_agent.py</text>
  <text x="670" y="374" text-anchor="middle" fill="#7a2a3f" font-size="11">handoff · delegation</text>

  <rect x="800" y="310" width="180" height="80" rx="10" fill="#fcecef" stroke="#ae3e5a" stroke-width="1.5"/>
  <text x="890" y="336" text-anchor="middle" font-weight="bold" fill="#7a2a3f">History Compressor</text>
  <text x="890" y="356" text-anchor="middle" fill="#7a2a3f" font-size="11">utils/history_compressor.py</text>
  <text x="890" y="374" text-anchor="middle" fill="#7a2a3f" font-size="11">budget exceeded → compress</text>

  <!-- Orchestrator ↔ SDK (request + response) -->
  <line x1="320" y1="250" x2="200" y2="310" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)"/>
  <text x="234" y="278" fill="#5a6b7f" font-size="10">step input</text>
  <line x1="240" y1="310" x2="360" y2="250" stroke="#1e8a5a" stroke-width="1.5" marker-end="url(#resp-end)"/>
  <text x="290" y="298" fill="#1e8a5a" font-size="10">stream events</text>

  <!-- Orchestrator → Sub / Compressor -->
  <line x1="440" y1="250" x2="660" y2="310" stroke="#5a6b7f" stroke-width="1.5"
        marker-end="url(#req-end)" stroke-dasharray="5 3"/>
  <text x="545" y="285" text-anchor="middle" fill="#5a6b7f" font-size="10">handoff / delegate</text>
  <line x1="500" y1="250" x2="860" y2="310" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)"/>
  <text x="714" y="270" text-anchor="middle" fill="#5a6b7f" font-size="10">budget exceeded</text>

  <!-- Sub → Orchestrator (parent_history, a response) -->
  <path d="M 670 310 C 600 260, 560 250, 540 244" fill="none"
        stroke="#1e8a5a" stroke-width="1.2" marker-end="url(#resp-end)"/>
  <text x="590" y="302" fill="#1e8a5a" font-size="10">parent_history</text>

  <!-- SDK ↔ Tools (request + response) -->
  <line x1="270" y1="336" x2="310" y2="336" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)"/>
  <text x="290" y="330" text-anchor="middle" fill="#5a6b7f" font-size="10">function call</text>
  <line x1="310" y1="358" x2="270" y2="358" stroke="#1e8a5a" stroke-width="1.5" marker-end="url(#resp-end)"/>
  <text x="290" y="372" text-anchor="middle" fill="#1e8a5a" font-size="10">tool result</text>

  <!-- Row 4: Workspace -->
  <rect x="160" y="460" width="680" height="70" rx="12" fill="#ede8f5" stroke="#5a4a9e" stroke-width="1.8"/>
  <text x="500" y="488" text-anchor="middle" font-weight="bold" fill="#3a2a7a">Workspace (per-user)</text>
  <text x="500" y="510" text-anchor="middle" fill="#5a4a9e" font-size="11">
    data/workspace/&lt;user&gt;/ · prompts · skills · sessions · images
  </text>

  <line x1="425" y1="390" x2="425" y2="460" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)"/>
  <text x="440" y="425" fill="#5a6b7f" font-size="10">tool writes</text>

  <line x1="890" y1="390" x2="780" y2="460" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)"/>

  <path d="M 280 460 C 210 420, 200 300, 290 250" fill="none"
        stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)" stroke-dasharray="5 3"/>
  <text x="184" y="380" fill="#5a6b7f" font-size="10">load profile /</text>
  <text x="184" y="394" fill="#5a6b7f" font-size="10">memory / skills</text>

  <!-- Legend -->
  <g transform="translate(40, 580)">
    <rect x="0"   y="0" width="13" height="13" fill="#f0f4fa" stroke="#4a6ea9"/>
    <text x="19"  y="11" font-size="11" fill="#333">Entry</text>
    <rect x="80"  y="0" width="13" height="13" fill="#dbe5f5" stroke="#2b5daf"/>
    <text x="99"  y="11" font-size="11" fill="#333">Orchestration</text>
    <rect x="200" y="0" width="13" height="13" fill="#fdf6e3" stroke="#b58900"/>
    <text x="219" y="11" font-size="11" fill="#333">Skill</text>
    <rect x="260" y="0" width="13" height="13" fill="#e6f3ea" stroke="#3a8e5a"/>
    <text x="279" y="11" font-size="11" fill="#333">Runtime / Tools</text>
    <rect x="400" y="0" width="13" height="13" fill="#fcecef" stroke="#ae3e5a"/>
    <text x="419" y="11" font-size="11" fill="#333">Auxiliary</text>
    <rect x="490" y="0" width="13" height="13" fill="#ede8f5" stroke="#5a4a9e"/>
    <text x="509" y="11" font-size="11" fill="#333">Persistence</text>

    <line x1="580" y1="6" x2="610" y2="6" stroke="#5a6b7f" stroke-width="1.5" marker-end="url(#req-end)"/>
    <text x="615" y="11" font-size="11" fill="#333">request</text>
    <line x1="680" y1="6" x2="710" y2="6" stroke="#1e8a5a" stroke-width="1.5" marker-end="url(#resp-end)"/>
    <text x="715" y="11" font-size="11" fill="#333">response / stream</text>
    <line x1="830" y1="6" x2="860" y2="6" stroke="#5a6b7f" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="865" y="11" font-size="11" fill="#333">injection / load</text>
  </g>
</svg>
